name: Build and Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      server-changed: ${{ steps.changes.outputs.server }}
      sfu-changed: ${{ steps.changes.outputs.sfu }}
      force-build: ${{ steps.check-images.outputs.force-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'src/**'
              - 'client/**'
              - 'assets/**'
              - 'package*.json'
              - 'patches/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
            sfu:
              - 'extra/pion-sfu/**'
              - 'Dockerfile'

      - name: Check if images exist
        id: check-images
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "force-build=true" >> $GITHUB_OUTPUT
            echo "🔄 Manual trigger - force building all services"
            exit 0
          fi
          if ! docker manifest inspect ghcr.io/itskyze/zycord:server-main > /dev/null 2>&1 || \
             ! docker manifest inspect ghcr.io/itskyze/zycord:sfu-main > /dev/null 2>&1; then
            echo "force-build=true" >> $GITHUB_OUTPUT
            echo "🔄 First deployment detected - will build all services"
          else
            echo "force-build=false" >> $GITHUB_OUTPUT
            echo "✅ All images exist in GHCR"
          fi

  build:
    name: build
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Zycord SFU image
      - name: Build and push SFU Docker image
        if: needs.detect-changes.outputs.sfu-changed == 'true' || needs.detect-changes.outputs.force-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sfu
          push: true
          tags: ghcr.io/itskyze/zycord:sfu-main
          cache-from: type=gha,scope=sfu
          cache-to: type=gha,mode=max,scope=sfu

      # Build and push Zycord Server image
      - name: Build and push Server Docker image
        if: needs.detect-changes.outputs.server-changed == 'true' || needs.detect-changes.outputs.force-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: ghcr.io/itskyze/zycord:server-main
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    name: deploy
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare payloads
        id: payloads
        run: |
          echo "compose=$(base64 -w 0 docker-compose.yml)" >> $GITHUB_OUTPUT
          echo "nginx=$(base64 -w 0 nginx.conf)" >> $GITHUB_OUTPUT
          echo "caddy=$(base64 -w 0 docker/Caddyfile)" >> $GITHUB_OUTPUT

      - name: Deploy and verify on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.DEPLOY_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.DEPLOY_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Deploying Zycord on $(hostname)..."

            mkdir -p /opt/zycord/docker
            cd /opt/zycord

            # 1. Update config files directly from repository payloads
            echo "${{ steps.payloads.outputs.compose }}" | base64 -d > docker-compose.yml
            echo "${{ steps.payloads.outputs.caddy }}" | base64 -d > docker/Caddyfile

            # 2. Check/initialize .env file
            if [ ! -f .env ]; then
              echo "⚠️ .env file not found, creating default .env..."
              echo "DOMAIN=app.zyron.site" > .env
              echo "INSTANCE_NAME=Zycord" >> .env
              echo "POSTGRES_PASSWORD=zycord_secure_pass_$(openssl rand -hex 12)" >> .env
              echo "WRTC_PUBLIC_IP=5.175.223.58" >> .env
              echo "WRTC_PORT=50000" >> .env
              echo "COMPOSE_PROFILES=caddy" >> .env
            fi

            # Ensure domain and name are synced
            sed -i 's/^DOMAIN=.*/DOMAIN=app.zyron.site/' .env
            sed -i 's/^INSTANCE_NAME=.*/INSTANCE_NAME=Zycord/' .env

            # 3. Handle Port 80 and Reverse Proxy (Caddy vs Host Nginx)
            # Stop any lingering legacy containers from other folders in /opt
            for dir in /opt/*; do
              if [ -d "$dir" ] && [ "$dir" != "/opt/zycord" ] && [ -f "$dir/docker-compose.yml" ]; then
                echo "🛑 Stopping outdated containers in $dir..."
                (cd "$dir" && docker compose down) 2>/dev/null || true
              fi
            done

            # Check if port 80 is in use
            if ss -tlpn | grep -q ":80 "; then
              echo "ℹ️ Port 80 is currently in use:"
              ss -tlpn | grep ":80 " || true

              # Stop any docker container holding port 80 from other projects
              DOCKER_PORT_80=$(docker ps --filter "publish=80" -q)
              if [ -n "$DOCKER_PORT_80" ]; then
                echo "🛑 Stopping old docker container holding port 80: $DOCKER_PORT_80"
                docker stop $DOCKER_PORT_80 || true
              fi

              # If host Nginx is active, use it as reverse proxy and disable Caddy container
              if systemctl is-active --quiet nginx; then
                echo "🌐 Host Nginx is active. Configuring app.zyron.site reverse proxy via Nginx..."
                mkdir -p /etc/nginx/conf.d
                echo "${{ steps.payloads.outputs.nginx }}" | base64 -d > /etc/nginx/conf.d/zycord.conf

                if [ -d /etc/nginx/sites-available ]; then
                  cp -f /etc/nginx/conf.d/zycord.conf /etc/nginx/sites-available/zycord 2>/dev/null || true
                  ln -sf /etc/nginx/sites-available/zycord /etc/nginx/sites-enabled/zycord 2>/dev/null || true
                fi
                nginx -t && systemctl reload nginx || true
                echo "✅ Nginx configured for app.zyron.site -> 127.0.0.1:3002"

                # Disable bundled caddy profile so docker compose won't try to bind port 80
                sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=/' .env
              fi
            fi

            # 4. Login to GitHub Container Registry on VPS
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 5. Pull pre-built images from GHCR
            echo "📥 Pulling latest pre-built Zycord images from GHCR..."
            docker compose pull server sfu

            # 6. Restart services
            echo "🚀 Starting Zycord containers..."
            docker compose up -d --remove-orphans

            # 7. Health verification
            echo "🔍 Verifying running containers..."
            sleep 10
            docker compose ps

            echo "🚀 Deployment and verification completed successfully!"

      - name: Deployment Summary
        run: |
          echo "📋 Deployment Summary:"
          echo "Server Changed: ${{ needs.detect-changes.outputs.server-changed }}"
          echo "SFU Changed: ${{ needs.detect-changes.outputs.sfu-changed }}"
          echo "Force Build: ${{ needs.detect-changes.outputs.force-build }}"
          echo ""
          echo "🌐 Zycord is available at: https://app.zyron.site"
