name: Build and Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      server-changed: ${{ steps.changes.outputs.server }}
      sfu-changed: ${{ steps.changes.outputs.sfu }}
      force-build: ${{ steps.check-images.outputs.force-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'src/**'
              - 'client/**'
              - 'assets/**'
              - 'package*.json'
              - 'patches/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
            sfu:
              - 'extra/pion-sfu/**'
              - 'Dockerfile'

      - name: Check if images exist
        id: check-images
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "force-build=true" >> $GITHUB_OUTPUT
            echo "🔄 Manual trigger - force building all services"
            exit 0
          fi
          if ! docker manifest inspect ghcr.io/itskyze/zycord:server-main > /dev/null 2>&1 || \
             ! docker manifest inspect ghcr.io/itskyze/zycord:sfu-main > /dev/null 2>&1; then
            echo "force-build=true" >> $GITHUB_OUTPUT
            echo "🔄 First deployment detected - will build all services"
          else
            echo "force-build=false" >> $GITHUB_OUTPUT
            echo "✅ All images exist in GHCR"
          fi

  build:
    name: build
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Zycord SFU image
      - name: Build and push SFU Docker image
        if: needs.detect-changes.outputs.sfu-changed == 'true' || needs.detect-changes.outputs.force-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sfu
          push: true
          tags: ghcr.io/itskyze/zycord:sfu-main
          cache-from: type=gha,scope=sfu
          cache-to: type=gha,mode=max,scope=sfu

      # Build and push Zycord Server image
      - name: Build and push Server Docker image
        if: needs.detect-changes.outputs.server-changed == 'true' || needs.detect-changes.outputs.force-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: ghcr.io/itskyze/zycord:server-main
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    name: deploy
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare payloads
        id: payloads
        run: |
          echo "compose=$(base64 -w 0 docker-compose.yml)" >> $GITHUB_OUTPUT
          echo "nginx=$(base64 -w 0 nginx.conf)" >> $GITHUB_OUTPUT
          echo "caddy=$(base64 -w 0 docker/Caddyfile)" >> $GITHUB_OUTPUT

      - name: Deploy and verify on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.DEPLOY_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.DEPLOY_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Deploying Zycord on $(hostname)..."

            mkdir -p /opt/zycord/docker
            cd /opt/zycord

            # 1. Update docker-compose.yml from repo
            echo "${{ steps.payloads.outputs.compose }}" | base64 -d > docker-compose.yml

            # 2. Check/initialize .env file (NEVER overwrite existing .env to avoid data loss)
            if [ ! -f .env ]; then
              echo "⚠️ .env file not found, creating default .env..."
              cat > .env << 'ENVEOF'
            DOMAIN=app.zyron.site
            INSTANCE_NAME=Zycord
            POSTGRES_PASSWORD=zycord_secure_pass_$(openssl rand -hex 12)
            WRTC_PUBLIC_IP=5.175.223.58
            WRTC_PORT=50000
            COMPOSE_PROFILES=
            SERVER_PORT=3001
            TRUSTED_PROXIES=uniquelocal
            ENVEOF
            else
              echo "✅ Using existing .env file (no overwrite)"
            fi

            # 3. Always disable Caddy when host Nginx is running (avoid port 80/443 conflict)
            if systemctl is-active --quiet nginx 2>/dev/null; then
              echo "🌐 Host Nginx detected — disabling Caddy profile in .env"
              # Set COMPOSE_PROFILES to empty (no caddy) safely
              if grep -q '^COMPOSE_PROFILES=' .env; then
                sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=/' .env
              else
                echo "COMPOSE_PROFILES=" >> .env
              fi

              # 4. Write the correct Nginx config for app.zyron.site
              echo "📝 Updating Nginx config for app.zyron.site..."
              mkdir -p /etc/nginx/conf.d
              echo "${{ steps.payloads.outputs.nginx }}" | base64 -d > /etc/nginx/conf.d/zycord.conf

              # Remove old conflicting sites-available/sites-enabled entries
              rm -f /etc/nginx/sites-enabled/zycord /etc/nginx/sites-available/zycord 2>/dev/null || true

              # Validate and reload Nginx
              if nginx -t; then
                systemctl reload nginx
                echo "✅ Nginx reloaded for app.zyron.site → 127.0.0.1:3002 (SSL)"
              else
                echo "❌ Nginx config test failed — keeping old config"
                nginx -T 2>/dev/null | tail -20 || true
              fi
            fi

            # 5. Login to GitHub Container Registry on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 6. Pull latest pre-built images from GHCR
            echo "📥 Pulling latest Zycord images from GHCR..."
            docker compose pull server sfu

            # 7. Restart services properly:
            #    - client must complete FIRST (compresses Discord client assets + applies patches)
            #    - server depends on client completing successfully
            echo "🔧 Rebuilding client assets (applies new patches)..."
            docker compose up --no-deps -d client

            echo "⏳ Waiting for client service to finish (up to 10 min)..."
            # Get the actual container ID for the client service
            CLIENT_ID=$(docker compose ps -q client)
            if [ -z "$CLIENT_ID" ]; then
              echo "❌ Could not find client container"
              exit 1
            fi
            # docker wait blocks until container exits, then prints exit code
            EXIT_CODE=$(timeout 600 docker wait "$CLIENT_ID" || echo "timeout")
            if [ "$EXIT_CODE" = "0" ]; then
              echo "✅ Client service completed successfully"
            elif [ "$EXIT_CODE" = "timeout" ]; then
              echo "❌ Client service timed out after 10 minutes"
              docker compose logs --tail=30 client
              exit 1
            else
              echo "❌ Client service failed with exit code $EXIT_CODE"
              docker compose logs --tail=30 client
              exit 1
            fi


            # 8. Restart the server with the new image
            echo "🚀 Restarting Zycord server..."
            docker compose up --no-deps -d server

            # 9. Wait for server to become healthy
            echo "⏳ Waiting for server to be healthy (up to 3 min)..."
            for i in $(seq 1 18); do
              HEALTH=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q server)" 2>/dev/null || echo "unknown")
              if [ "$HEALTH" = "healthy" ]; then
                echo "✅ Server is healthy!"
                break
              fi
              echo "   server health: $HEALTH — waiting... ($i/18)"
              sleep 10
            done
            if [ "$HEALTH" != "healthy" ]; then
              echo "⚠️ Server health check timed out — check logs manually"
            fi


            # 10. Final status
            echo "📋 Final container status:"
            docker compose ps

            # 11. Quick API smoke test
            if curl -sf http://127.0.0.1:3002/api/ping > /dev/null 2>&1; then
              echo "✅ API smoke test passed: http://127.0.0.1:3002/api/ping"
            else
              echo "⚠️ API smoke test failed — server may still be starting"
              docker compose logs --tail=20 server
            fi

            echo "🎉 Deployment completed successfully!"

      - name: Deployment Summary
        run: |
          echo "📋 Deployment Summary:"
          echo "Server Changed: ${{ needs.detect-changes.outputs.server-changed }}"
          echo "SFU Changed:    ${{ needs.detect-changes.outputs.sfu-changed }}"
          echo "Force Build:    ${{ needs.detect-changes.outputs.force-build }}"
          echo ""
          echo "🌐 Zycord is available at: https://app.zyron.site"
