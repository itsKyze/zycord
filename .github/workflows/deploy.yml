name: Deploy Zycord to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Zycord deployment on $(hostname)..."

            # 1. Ensure target directory exists
            mkdir -p /opt/zycord
            cd /opt/zycord

            # 2. Sync latest code from GitHub
            if [ -d .git ]; then
              echo "📥 Fetching latest commits from GitHub..."
              git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📦 Cloning repository..."
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi

            # 3. Ensure .env exists with required domain and configuration
            if [ ! -f .env ]; then
              echo "⚠️ .env not found, initializing from .env.example..."
              cp .env.example .env
            fi

            # Keep domain and instance name updated
            sed -i 's/^DOMAIN=.*/DOMAIN=app.zyron.site/' .env
            sed -i 's/^INSTANCE_NAME=.*/INSTANCE_NAME=Zycord/' .env

            # 4. Rebuild and launch Docker containers
            echo "🐳 Building and starting Docker services..."
            docker compose down || true
            docker compose up -d --build

            echo "✅ Zycord successfully deployed to https://app.zyron.site"
