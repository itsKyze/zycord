<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Zycord Developer Portal | Build with Zycord</title>
	<meta name="description" content="Build bots, apps, integrations, and games for communities with the Zycord Developer Platform and APIs." />

	<!-- Open Graph / Discord / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Zycord" />
	<meta property="og:title" content="Zycord Developer Portal | Zycord" />
	<meta property="og:description" content="Build bots, apps, integrations, and games for communities with the Zycord Developer Platform and APIs." />
	<meta property="og:image" content="/site/og-image.jpg" />
	<meta property="og:image:secure_url" content="/site/og-image.jpg" />
	<meta property="og:image:type" content="image/jpeg" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="Zycord Developer Portal | Zycord" />
	<meta property="og:url" content="/developers" />

	<!-- Twitter Cards -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:site" content="@zycord" />
	<meta name="twitter:title" content="Zycord Developer Portal | Zycord" />
	<meta name="twitter:description" content="Build bots, apps, integrations, and games for communities with the Zycord Developer Platform and APIs." />
	<meta name="twitter:image" content="/site/og-image.jpg" />

	<!-- Mobile & Theme -->
	<meta name="theme-color" content="#5865F2" />
	<meta name="apple-mobile-web-app-title" content="Zycord" />
	<meta name="application-name" content="Zycord" />
        <meta name="robots" content="noindex" />
        <link rel="icon" href="/favicon.svg" />
        <link rel="stylesheet" href="/developers/portal.css" />
        <script id="portal-config" type="application/json">
            {{CONFIG}}
        </script>
    </head>
    <body>
        <a class="skip-link" href="#view">Skip to content</a>
        <div id="zy-dev-topbar-mount"></div>
        <div class="layout">
            <aside class="sidebar">
                <a class="brand" href="/developers/applications" data-link>
                    <img id="brand-icon" class="brand-icon" src="/static/logo.png" alt="" width="32" height="32" />
                    <span>
                        <strong id="brand-name"></strong>
                        <span class="muted">Developer Portal</span>
                    </span>
                </a>
                <nav id="nav" aria-label="Developer Portal"></nav>
                <div class="sidebar-quick-links">
                    <a href="/developers"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline;vertical-align:middle;margin-right:5px;"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Developer Hub</a>
                    <a href="/_zycord/api/openapi.json" target="_blank" rel="noopener"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline;vertical-align:middle;margin-right:5px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>OpenAPI JSON ↗</a>
                    <a href="/status" target="_blank" rel="noopener"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline;vertical-align:middle;margin-right:5px;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>API Status ↗</a>
                </div>
                <a class="sidebar-foot" href="/channels/@me">← Back to Zycord App</a>
            </aside>
            <div class="portal-main-col">
                <div id="zy-dev-hero-mount"></div>
                <main id="view" class="view" tabindex="-1"></main>
            </div>
        </div>
        <script src="/developers/portal-shell.js"></script>
        <script src="/developers/portal.js"></script>
    </body>
</html>
