<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Zycord Developer Portal | Build with Zycord</title>
	<meta name="description" content="Build bots, apps, integrations, and games for communities with the Zycord Developer Platform and APIs." />

	<!-- Open Graph / Discord / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Zycord" />
	<meta property="og:title" content="Zycord Developer Portal | Zycord" />
	<meta property="og:description" content="Build bots, apps, integrations, and games for communities with the Zycord Developer Platform and APIs." />
	<meta property="og:image" content="/site/og-image.jpg" />
	<meta property="og:image:secure_url" content="/site/og-image.jpg" />
	<meta property="og:image:type" content="image/jpeg" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="Zycord Developer Portal | Zycord" />
	<meta property="og:url" content="/developers" />

	<!-- Twitter Cards -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:site" content="@zycord" />
	<meta name="twitter:title" content="Zycord Developer Portal | Zycord" />
	<meta name="twitter:description" content="Build bots, apps, integrations, and games for communities with the Zycord Developer Platform and APIs." />
	<meta name="twitter:image" content="/site/og-image.jpg" />

	<!-- Mobile & Theme -->
	<meta name="theme-color" content="#5865F2" />
	<meta name="apple-mobile-web-app-title" content="Zycord" />
	<meta name="application-name" content="Zycord" />
        <meta name="robots" content="noindex" />
        <link rel="icon" href="/favicon.svg" />
        <link rel="stylesheet" href="/developers/portal.css" />
        <script id="portal-config" type="application/json">
            {{CONFIG}}
        </script>
    </head>
    <body>
        <a class="skip-link" href="#view">Skip to content</a>
        <div id="zy-dev-topbar-mount"></div>
        <div class="layout">
            <aside class="sidebar" aria-label="Developer Portal">
                <div class="sidebar-content">
                    <nav id="nav" aria-label="Developer Portal"></nav>
                </div>
            </aside>
            <div class="sidebar-overlay" data-dp-overlay></div>
            <main id="view" class="view" tabindex="-1"></main>
        </div>
        <script src="/developers/portal-shell.js"></script>
        <script src="/developers/portal.js"></script>
    </body>
</html>
