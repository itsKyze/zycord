<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>__INSTANCE_NAME__ — Group Chat That's All Fun &amp; Games</title>
	<meta name="description" content="__INSTANCE_NAME__ is great for playing games and chilling with friends, or even building a worldwide community. Customize your own space to talk, play, and hang out." />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="stylesheet" href="/site/site.css" />
	<style>
		/* ============================================================================
		   OFFICIAL DISCORD 2026 3D HERO COMPOSITE & HORIZON STYLES
		   ============================================================================ */
		.hero-section {
			padding: 44px 0 88px;
			position: relative;
			overflow: hidden;
		}
		.hero-grid {
			display: grid;
			grid-template-columns: 0.78fr 1.42fr;
			gap: 28px;
			align-items: center;
			position: relative;
			z-index: 2;
		}
		.hero-copy {
			display: flex;
			flex-direction: column;
			gap: 20px;
			position: relative;
			z-index: 3;
		}
		.hero-crown-wrap {
			position: relative;
			height: 44px;
		}
		.hero-crown {
			position: absolute;
			left: 34%;
			top: -54px;
			width: 118px;
			height: auto;
			filter: blur(2px) drop-shadow(0 16px 28px rgba(0, 0, 0, 0.55));
			opacity: 0.88;
			animation: zy-float-tilt 5.5s ease-in-out infinite;
			pointer-events: none;
		}
		.hero-art-stage {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 460px;
		}
		.hero-art-glow {
			position: absolute;
			inset: -32px;
			background:
				radial-gradient(circle at 48% 42%, rgba(88, 101, 242, 0.65) 0%, transparent 62%),
				radial-gradient(circle at 78% 72%, rgba(235, 69, 158, 0.35) 0%, transparent 55%);
			filter: blur(40px);
			z-index: 0;
			pointer-events: none;
		}
		.hero-3d-composite {
			position: relative;
			z-index: 2;
			width: 100%;
			max-width: 820px;
		}
		.hero-main-devices-img {
			width: 100%;
			height: auto;
			display: block;
			filter: drop-shadow(0 32px 64px rgba(0, 0, 0, 0.65));
		}
		.hero-char-girl {
			position: absolute;
			left: -4%;
			bottom: -3%;
			width: 19%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
		}
		.hero-char-clyde {
			position: absolute;
			left: 11.5%;
			bottom: -2%;
			width: 10.5%;
			height: auto;
			z-index: 5;
			pointer-events: none;
			filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.58));
		}
		.hero-char-wumpus {
			position: absolute;
			left: 45%;
			bottom: -5%;
			width: 19%;
			height: auto;
			z-index: 5;
			pointer-events: none;
			filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.58));
		}
		.hero-char-wumpus-leaf {
			position: absolute;
			left: 49.5%;
			bottom: 24.5%;
			width: 7.2%;
			height: auto;
			z-index: 6;
			pointer-events: none;
		}
		.hero-char-boy {
			position: absolute;
			right: -1.5%;
			bottom: -3%;
			width: 15.5%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
		}
		.hero-trophy-blur {
			position: absolute;
			right: -8%;
			top: 34%;
			width: 112px;
			height: auto;
			z-index: 1;
			pointer-events: none;
			filter: blur(3px) drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
			opacity: 0.78;
		}

		/* Centered Hero Bottom CTA Bar (Exact Discord.com layout) */
		.hero-bottom-ctas {
			display: flex;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
			gap: 20px;
			margin-top: 52px;
			position: relative;
			z-index: 5;
		}
		.hero-bottom-ctas .zy-btn {
			font-size: 18px;
			padding: 18px 32px;
			border-radius: 16px;
		}

		/* Final Bottom Horizon Section */
		.final-horizon-section {
			padding-top: 64px;
			padding-bottom: 0;
			position: relative;
			overflow: visible;
			text-align: center;
			z-index: 5;
		}
		.final-horizon-section::after {
			content: "";
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			height: 11%;
			background: #131542;
			border-top: 2px solid rgba(102, 116, 255, 0.38);
			z-index: 1;
			pointer-events: none;
		}
		.final-horizon-art {
			position: relative;
			margin-top: 28px;
			margin-bottom: -24px;
			width: 100%;
			max-width: 1120px;
			margin-left: auto;
			margin-right: auto;
			z-index: 3;
		}
		.final-horizon-bg {
			width: 100%;
			height: auto;
			display: block;
			position: relative;
			z-index: 2;
		}
		.final-horizon-clyde {
			position: absolute;
			left: 24.8%;
			bottom: 4.5%;
			width: clamp(88px, 8.8vw, 134px);
			height: auto;
			z-index: 3;
			pointer-events: none;
			filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.52));
		}
		.final-horizon-wumpus {
			position: absolute;
			left: 49.5%;
			bottom: -4.5%;
			transform: translateX(-50%);
			width: clamp(165px, 16vw, 232px);
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.6));
		}
		.final-horizon-leaf {
			position: absolute;
			left: 48.2%;
			bottom: 47.5%;
			transform: translateX(-50%);
			width: clamp(74px, 7.2vw, 106px);
			height: auto;
			z-index: 5;
			pointer-events: none;
		}
		.final-horizon-smoke {
			position: absolute;
			left: 50%;
			bottom: 50%;
			transform: translateX(-50%);
			width: clamp(76px, 8vw, 118px);
			height: auto;
			z-index: 3;
			pointer-events: none;
			opacity: 0.88;
		}

		@media (max-width: 980px) {
			.hero-grid {
				grid-template-columns: 1fr;
				text-align: center;
			}
			.hero-copy {
				align-items: center;
			}
		}
		@media (max-width: 580px) {
			.hero-bottom-ctas .zy-btn {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<!-- Global Discord 2026 Mega-Dropdown Navbar (Rendered via JSX) -->
	<header data-zy-navbar></header>

	<!-- Homepage JSX Mount Point -->
	<main data-zy-jsx-page="home"></main>

	<!-- Global Discord 2026 Blurple Footer (Rendered via JSX) -->
	<footer data-zy-footer></footer>

	<script src="/site/site.js"></script>
</body>
</html>
