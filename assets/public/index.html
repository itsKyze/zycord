	<style>
		/* ============================================================================
		   OFFICIAL ZYCORD 2026 3D HERO COMPOSITE & HORIZON STYLES
		   ============================================================================ */
		.hero-section {
			padding: 140px 0 96px;
			position: relative;
			overflow: hidden;
		}
		@media screen and (min-width: 1440px) {
			.hero-section {
				padding-top: 11rem;
			}
		}
		.hero-grid {
			display: grid;
			grid-template-columns: 0.78fr 1.42fr;
			gap: 28px;
			align-items: center;
			position: relative;
			z-index: 2;
		}
		.hero-copy {
			display: flex;
			flex-direction: column;
			gap: 24px;
			position: relative;
			z-index: 3;
		}
		.hero-crown-wrap {
			position: relative;
			height: 44px;
		}
		.hero-crown {
			position: absolute;
			left: 38%;
			top: -72px;
			width: clamp(135px, 11vw, 168px);
			height: auto;
			filter: blur(3px) drop-shadow(0 16px 28px rgba(0, 0, 0, 0.52));
			opacity: 0.86;
			pointer-events: none;
		}
		.hero-art-stage {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: clamp(500px, 42vw, 660px);
		}
		.hero-art-glow {
			position: absolute;
			inset: -40px;
			background:
				radial-gradient(circle at 48% 42%, rgba(88, 101, 242, 0.65) 0%, transparent 62%),
				radial-gradient(circle at 78% 72%, rgba(235, 69, 158, 0.35) 0%, transparent 55%);
			filter: blur(44px);
			z-index: 0;
			pointer-events: none;
		}
		.hero-3d-composite {
			position: relative;
			z-index: 2;
			width: 100%;
			max-width: 1020px;
		}
		.hero-main-devices-img {
			width: 100%;
			height: auto;
			display: block;
			filter: drop-shadow(0 32px 64px rgba(0, 0, 0, 0.65));
		}
		.hero-char-girl {
			position: absolute;
			left: -3.5%;
			bottom: -3.5%;
			width: 24.5%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
		}
		.hero-char-clyde-wrap {
			position: absolute;
			left: 11.8%;
			bottom: 2.2%;
			width: 9.8%;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 5px;
			z-index: 5;
			pointer-events: none;
		}
		.hero-char-clyde {
			width: 100%;
			height: auto;
			filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.58));
			animation: hero-clyde-bob 3.8s ease-in-out infinite;
		}
		.hero-char-clyde-shadow {
			width: 86%;
			height: 3px;
			opacity: 0.72;
			animation: hero-clyde-shadow-pulse 3.8s ease-in-out infinite;
		}
		.hero-char-wumpus {
			position: absolute;
			left: 47%;
			bottom: 0%;
			width: clamp(210px, 24vw, 330px);
			height: auto;
			z-index: 5;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
		}
		.hero-char-wumpus-leaf {
			position: absolute;
			left: 48%;
			bottom: 25%;
			width: clamp(75px, 7.2vw, 105px);
			height: auto;
			z-index: 6;
			pointer-events: none;
			animation: hero-leaf-float 4.2s ease-in-out infinite;
			filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
		}
		.hero-char-boy {
			position: absolute;
			right: -1.5%;
			bottom: -1%;
			width: 19.5%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
		}
		.hero-trophy-blur {
			position: absolute;
			right: -9%;
			top: 28%;
			width: clamp(145px, 12vw, 190px);
			height: auto;
			z-index: 1;
			pointer-events: none;
			filter: blur(4px) drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
			opacity: 0.78;
		}
		@keyframes hero-clyde-bob {
			0%, 100% { transform: translate3d(0, -10px, 0); }
			50% { transform: translate3d(0, 2px, 0); }
		}
		@keyframes hero-clyde-shadow-pulse {
			0%, 100% { transform: scaleX(0.84); opacity: 0.55; }
			50% { transform: scaleX(1.06); opacity: 0.88; }
		}
		@keyframes hero-leaf-float {
			0%, 100% { transform: translate3d(0, 0px, 0) rotate(-3deg); }
			50% { transform: translate3d(0, -6px, 0) rotate(4deg); }
		}

		/* Hero CTAs on the left inside .hero-copy (Matches Screenshot 1) */
		.hero-ctas {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 16px;
			margin-top: 32px;
			position: relative;
			z-index: 5;
		}
		.hero-ctas .hero-btn-dl {
			background-color: #ffffff;
			color: #23272a;
			font-size: 16px;
			font-weight: 500;
			padding: 15px 30px;
			border-radius: 9999px;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
			transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
			display: inline-flex;
			align-items: center;
			gap: 10px;
		}
		.hero-ctas .hero-btn-dl:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
			color: #5865F2;
		}
		.hero-ctas .hero-btn-open {
			background-color: #5865F2;
			color: #ffffff;
			font-size: 16px;
			font-weight: 500;
			padding: 15px 30px;
			border-radius: 9999px;
			transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
			display: inline-flex;
			align-items: center;
			gap: 10px;
		}
		.hero-ctas .hero-btn-open:hover {
			background-color: #4752c4;
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(88, 101, 242, 0.4);
		}

		/* Exact Zycord Section 5 Characters Structure */
		.zy-sec5-3d-wrap {
			position: relative;
			z-index: 3;
			max-width: 1180px;
			margin: 0 auto;
			overflow: visible;
		}
		@media (min-width: 1440px) {
			.zy-sec5-3d-wrap {
				max-width: 1240px;
			}
		}
		@media (min-width: 1920px) {
			.zy-sec5-3d-wrap {
				max-width: 1500px;
			}
		}
		.zy-sec5-char-bot {
			position: absolute;
			top: -195px;
			right: 210px;
			width: clamp(260px, 22vw, 310px);
			height: auto;
			z-index: 6;
			pointer-events: none;
			display: block;
			filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.55));
		}
		.zy-sec5-char-top {
			position: absolute;
			top: -78px;
			right: 218px;
			width: clamp(260px, 22vw, 310px);
			height: auto;
			z-index: 1;
			opacity: 0.28;
			filter: blur(6px);
			pointer-events: none;
			display: block;
		}
		.zy-sec5-char-friends {
			position: absolute;
			top: -205px;
			right: 52px;
			width: clamp(280px, 22vw, 330px);
			height: auto;
			z-index: 1;
			clip-path: inset(0 0 41.5% 0);
			pointer-events: none;
			display: block;
		}

		/* Final Bottom Horizon Section (Matches live Discord .relative-2025 & .discord_svg.is_2025.is_n) */
		.final-horizon-section {
			padding-top: 72px;
			padding-bottom: 0;
			position: relative;
			overflow: visible;
			text-align: center;
			z-index: 100;
			pointer-events: none;
		}
		.final-horizon-section .zy-container,
		.final-horizon-section .zy-btn {
			pointer-events: auto;
		}
		.final-horizon-art {
			position: relative;
			margin-top: 48px;
			margin-bottom: 0;
			width: 100%;
			max-width: 1220px;
			margin-left: auto;
			margin-right: auto;
			z-index: 8;
			overflow: visible;
		}
		.final-horizon-bg {
			width: 100%;
			height: auto;
			display: block;
			position: relative;
			bottom: 0;
			z-index: 2;
			margin: 0 auto;
		}
		@media (min-width: 1920px) {
			.final-horizon-art {
				max-width: 1440px;
			}
		}
		/* Clyde 3D Robot — Girl's hand rests on top of Clyde's screen (Matches Screenshot 2) */
		.final-horizon-clyde {
			position: absolute;
			left: 23.4%;
			bottom: 11%;
			width: clamp(120px, 10.8vw, 160px);
			height: auto;
			z-index: 5;
			pointer-events: none;
			filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.52));
		}
		/* Wumpus: prominent in the middle gap, hands planted on horizon edge, legs dangling (Matches Screenshot 2) */
		.final-horizon-wumpus {
			position: absolute;
			left: 49.6%;
			bottom: -5.5%;
			transform: translateX(-50%);
			width: clamp(280px, 25.5vw, 370px);
			height: auto;
			z-index: 9;
			pointer-events: none;
			filter: drop-shadow(0 24px 42px rgba(0, 0, 0, 0.62));
		}
		/* Leaf: hovering naturally 15px-25px directly above Wumpus's head (Matches Screenshot 2) */
		.final-horizon-leaf {
			position: absolute;
			left: 48.6%;
			bottom: 53.5%;
			transform: translateX(-50%);
			width: clamp(68px, 6vw, 92px);
			height: auto;
			z-index: 10;
			pointer-events: none;
			animation: horizon-leaf-float 4.2s ease-in-out infinite;
			filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
		}
		.final-horizon-smoke {
			position: absolute;
			left: 23.4%;
			bottom: 22%;
			transform: translateX(-50%);
			width: clamp(80px, 7vw, 110px);
			height: auto;
			z-index: 4;
			pointer-events: none;
			opacity: 0;
		}
		@keyframes horizon-leaf-float {
			0%, 100% { transform: translate3d(-50%, 0px, 0) rotate(-3deg); }
			50% { transform: translate3d(-50%, -8px, 0) rotate(4deg); }
		}

		@media (max-width: 980px) {
			.hero-grid {
				grid-template-columns: 1fr;
				text-align: center;
			}
			.hero-copy {
				align-items: center;
			}
		}
		@media (max-width: 580px) {
			.hero-bottom-ctas .zy-btn {
				width: 100%;
			}
		}
	</style>
