	<style>
		/* ============================================================================
		   OFFICIAL ZYCORD 2026 3D HERO COMPOSITE & HORIZON STYLES
		   ============================================================================ */
		.hero-section {
			padding: 140px 0 96px;
			position: relative;
			overflow: hidden;
		}
		@media screen and (min-width: 1440px) {
			.hero-section {
				padding-top: 11rem;
			}
		}
		.hero-grid {
			display: grid;
			grid-template-columns: 0.78fr 1.42fr;
			gap: 28px;
			align-items: center;
			position: relative;
			z-index: 2;
		}
		.hero-copy {
			display: flex;
			flex-direction: column;
			gap: 24px;
			position: relative;
			z-index: 3;
		}
		.hero-crown-wrap {
			position: relative;
			height: 44px;
		}
		.hero-crown {
			position: absolute;
			left: 38%;
			top: -72px;
			width: clamp(135px, 11vw, 168px);
			height: auto;
			filter: blur(3px) drop-shadow(0 16px 28px rgba(0, 0, 0, 0.52));
			opacity: 0.86;
			pointer-events: none;
		}
		.hero-art-stage {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: clamp(460px, 40vw, 640px);
		}
		.hero-art-glow {
			position: absolute;
			inset: -40px;
			background:
				radial-gradient(circle at 48% 42%, rgba(88, 101, 242, 0.65) 0%, transparent 62%),
				radial-gradient(circle at 78% 72%, rgba(235, 69, 158, 0.35) 0%, transparent 55%);
			filter: blur(44px);
			z-index: 0;
			pointer-events: none;
		}
		.hero-3d-composite {
			position: relative;
			z-index: 2;
			width: 100%;
			max-width: 980px;
			margin: 0 auto;
		}
		.hero-main-devices-img {
			width: 100%;
			height: auto;
			display: block;
			filter: drop-shadow(0 32px 64px rgba(0, 0, 0, 0.65));
		}
		.hero-char-girl {
			position: absolute;
			left: -2%;
			bottom: 0%;
			width: 26%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.55));
		}
		.hero-char-clyde-wrap {
			position: absolute;
			left: 20%;
			bottom: 9%;
			width: 11%;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
			z-index: 5;
			pointer-events: none;
		}
		.hero-char-clyde {
			width: 100%;
			height: auto;
			filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.5));
			animation: hero-clyde-bob 3.8s ease-in-out infinite;
		}
		.hero-char-clyde-shadow {
			width: 80%;
			height: 3px;
			opacity: 0.65;
			animation: hero-clyde-shadow-pulse 3.8s ease-in-out infinite;
		}
		.hero-char-wumpus-wrap {
			position: absolute;
			left: 42%;
			bottom: -1%;
			transform: translateX(-50%);
			width: 20%;
			display: block;
			z-index: 6;
			pointer-events: none;
		}
		.hero-char-wumpus {
			width: 100%;
			height: auto;
			display: block;
			filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.55));
		}
		.hero-char-wumpus-leaf {
			position: absolute;
			bottom: 91%;
			left: 29%;
			width: 40%;
			height: auto;
			z-index: 7;
			animation: hero-leaf-float 4.2s ease-in-out infinite;
			filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
		}
		.hero-char-boy {
			position: absolute;
			left: 73%;
			bottom: 0%;
			width: 20%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.55));
		}
		.hero-trophy-blur {
			position: absolute;
			right: -1%;
			top: 24%;
			width: clamp(140px, 12vw, 195px);
			height: auto;
			z-index: 1;
			pointer-events: none;
			filter: blur(4px) drop-shadow(0 16px 28px rgba(0, 0, 0, 0.45));
			opacity: 0.78;
		}
		@keyframes hero-clyde-bob {
			0%, 100% { transform: translate3d(0, -10px, 0); }
			50% { transform: translate3d(0, 2px, 0); }
		}
		@keyframes hero-clyde-shadow-pulse {
			0%, 100% { transform: scaleX(0.84); opacity: 0.55; }
			50% { transform: scaleX(1.06); opacity: 0.88; }
		}
		@keyframes hero-leaf-float {
			0%, 100% { transform: translate3d(0, 0px, 0) rotate(-3deg); }
			50% { transform: translate3d(0, -6px, 0) rotate(4deg); }
		}

		/* Centered Hero Bottom CTA Bar (Exact Zycord layout) */
		.hero-bottom-ctas {
			display: flex;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
			gap: 18px;
			margin-top: 44px;
			position: relative;
			z-index: 5;
		}
		.hero-bottom-ctas .zy-btn {
			font-size: 18px;
			line-height: 24px;
			font-weight: 500;
			padding: 15.5px 28px;
			min-height: 54px;
			border-radius: 12px;
		}

		/* Exact Zycord Section 5 Characters Structure */
		.zy-sec5-3d-wrap {
			position: relative;
			z-index: 3;
			max-width: 1180px;
			margin: 0 auto;
			overflow: visible;
		}
		@media (min-width: 1440px) {
			.zy-sec5-3d-wrap {
				max-width: 1240px;
			}
		}
		@media (min-width: 1920px) {
			.zy-sec5-3d-wrap {
				max-width: 1500px;
			}
		}
		.zy-sec5-char-bot {
			position: absolute;
			top: -195px;
			right: 210px;
			width: clamp(260px, 22vw, 310px);
			height: auto;
			z-index: 6;
			pointer-events: none;
			display: block;
			filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.55));
		}
		.zy-sec5-char-top {
			position: absolute;
			top: -78px;
			right: 218px;
			width: clamp(260px, 22vw, 310px);
			height: auto;
			z-index: 1;
			opacity: 0.28;
			filter: blur(6px);
			pointer-events: none;
			display: block;
		}
		.zy-sec5-char-friends {
			position: absolute;
			top: -205px;
			right: 52px;
			width: clamp(280px, 22vw, 330px);
			height: auto;
			z-index: 1;
			clip-path: inset(0 0 41.5% 0);
			pointer-events: none;
			display: block;
		}

		/* Final Bottom Horizon Section — Discord 2026 Exact Match */
		.final-horizon-section {
			padding-top: clamp(52px, 5.5vw, 80px);
			padding-bottom: 0;
			margin-bottom: 0;
			position: relative;
			overflow: visible;
			text-align: center;
			z-index: 10;
			pointer-events: none;
			/* Seamless dark navy that bleeds directly into the footer */
			background-color: #08091f;
			background-image:
				radial-gradient(ellipse 90% 60% at 50% 100%, rgba(88,101,242,0.28) 0%, transparent 70%),
				url("/site/media/zycord/home-tex-7.webp");
			background-position: 50% 100%, 50% 50%;
			background-repeat: no-repeat, no-repeat;
			background-size: 100% 100%, cover;
		}
		.final-horizon-section .zy-container,
		.final-horizon-section .zy-btn {
			pointer-events: auto;
		}
		/* HEADING — Bold uppercase, Discord-weight white */
		.final-horizon-section .zy-display {
			font-size: clamp(30px, 4.5vw, 56px);
			font-weight: 900;
			letter-spacing: -0.02em;
			line-height: 1.1;
			text-transform: uppercase;
			color: #ffffff;
			max-width: 860px;
			margin: 0 auto;
		}
		/* CTA BAR — centered */
		.final-horizon-section .hero-bottom-ctas {
			display: flex;
			justify-content: center;
			align-items: center;
			margin-top: 28px;
			pointer-events: auto;
		}
		/* BUTTON — Discord's white pill button */
		.final-horizon-section .zy-btn-secondary {
			background-color: #ffffff;
			color: #060607;
			font-size: 17px;
			font-weight: 700;
			padding: 16px 36px;
			border-radius: 40px;
			border: none;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28), 0 1px 4px rgba(0,0,0,0.18);
			transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
			letter-spacing: 0.01em;
		}
		.final-horizon-section .zy-btn-secondary:hover {
			background-color: #f0f1ff;
			transform: translateY(-3px);
			box-shadow: 0 10px 32px rgba(0, 0, 0, 0.38), 0 2px 6px rgba(0,0,0,0.22);
		}
		/* ART CONTAINER */
		.final-horizon-art {
			position: relative;
			margin-top: 40px;
			margin-bottom: 0;
			width: 100%;
			max-width: 1440px;
			margin-left: auto;
			margin-right: auto;
			z-index: 8;
			overflow: visible;
			line-height: 0;
			pointer-events: none;
		}
		@media (min-width: 1920px) {
			.final-horizon-art {
				max-width: 1680px;
			}
		}
		/* CHARACTER LINEUP (footer-horizon.webp) — fills the section width */
		.final-horizon-bg {
			width: 100%;
			height: auto;
			display: block;
			position: relative;
			bottom: 0;
			z-index: 2;
			margin: 0 auto;
			pointer-events: none;
			/* Subtle fade at bottom so characters blend into footer */
			-webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
			mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
		}
		/* Glow floor line at the bottom edge */
		.final-horizon-floor {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			height: 1px;
			background: linear-gradient(90deg, transparent 0%, rgba(88,101,242,0.55) 20%, rgba(135,94,255,0.75) 50%, rgba(88,101,242,0.55) 80%, transparent 100%);
			box-shadow: 0 0 22px 4px rgba(88,101,242,0.35);
			z-index: 1;
			pointer-events: none;
			display: block !important;
		}
		/* 3D CLYDE ROBOT — left side of the gap between character groups */
		.final-horizon-clyde {
			position: absolute;
			left: 30%;
			bottom: 2%;
			width: 8%;
			max-width: 115px;
			height: auto;
			z-index: 6;
			pointer-events: none;
			filter: drop-shadow(0 12px 20px rgba(0,0,0,0.55));
			animation: clyde-hover 4s ease-in-out infinite;
		}
		@keyframes clyde-hover {
			0%, 100% { transform: translate3d(0, 0, 0) rotate(-2deg); }
			50% { transform: translate3d(0, -6px, 0) rotate(2deg); }
		}
		/* WUMPUS SITTING AT CENTER — hangs over the edge into the footer */
		.final-horizon-wumpus-wrap {
			position: absolute;
			left: 50%;
			bottom: -6%;
			transform: translateX(-50%);
			width: 18%;
			max-width: 260px;
			display: block;
			z-index: 10;
			pointer-events: none;
		}
		.final-horizon-wumpus {
			width: 100%;
			height: auto;
			display: block;
			filter: drop-shadow(0 18px 32px rgba(0,0,0,0.65));
		}
		/* LEAF floating above Wumpus */
		.final-horizon-leaf {
			position: absolute;
			bottom: 88%;
			left: 50%;
			transform: translateX(-50%);
			width: 52%;
			height: auto;
			z-index: 12;
			pointer-events: none;
			animation: horizon-leaf-float 4.2s ease-in-out infinite;
			filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
		}
		.final-horizon-smoke {
			position: absolute;
			left: 30%;
			bottom: 28%;
			transform: translateX(-50%);
			width: clamp(70px, 6vw, 100px);
			height: auto;
			z-index: 5;
			pointer-events: none;
			opacity: 0.7;
			animation: smoke-drift 6s ease-in-out infinite;
		}
		@keyframes horizon-leaf-float {
			0%, 100% { transform: translateX(-50%) translate3d(0, 0px, 0) rotate(-2deg); }
			50% { transform: translateX(-50%) translate3d(1px, -8px, 0) rotate(4deg); }
		}
		@keyframes smoke-drift {
			0%, 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.7; }
			50% { transform: translateX(-50%) translateY(-10px) scale(1.06); opacity: 0.5; }
		}

		/* Responsive adjustments */
		@media (max-width: 1024px) {
			.final-horizon-clyde { left: 26%; width: 9%; }
			.final-horizon-wumpus-wrap { width: 20%; bottom: -5%; }
		}
		@media (max-width: 768px) {
			.final-horizon-clyde { display: none; }
			.final-horizon-wumpus-wrap { width: 26%; bottom: -4%; }
			.final-horizon-smoke { display: none; }
		}
		@media (max-width: 980px) {
			.hero-grid {
				grid-template-columns: 1fr;
				text-align: center;
			}
			.hero-copy {
				align-items: center;
			}
		}
		@media (max-width: 580px) {
			.hero-bottom-ctas .zy-btn {
				width: 100%;
			}
		}
	</style>
