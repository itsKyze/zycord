<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>__INSTANCE_NAME__ — Group Chat That's All Fun &amp; Games</title>
	<meta name="description" content="__INSTANCE_NAME__ is great for playing games and chilling with friends, or even building a worldwide community. Customize your own space to talk, play, and hang out." />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="stylesheet" href="/site/site.css" />
	<style>
		/* ============================================================================
		   OFFICIAL DISCORD 2026 3D HERO COMPOSITE & HORIZON STYLES
		   ============================================================================ */
		.hero-section {
			padding: 48px 0 96px;
			position: relative;
			overflow: hidden;
		}
		.hero-grid {
			display: grid;
			grid-template-columns: 0.88fr 1.32fr;
			gap: 36px;
			align-items: center;
			position: relative;
			z-index: 2;
		}
		.hero-copy {
			display: flex;
			flex-direction: column;
			gap: 22px;
			position: relative;
			z-index: 3;
		}
		.hero-crown-wrap {
			position: relative;
			display: inline-block;
		}
		.hero-crown {
			width: 86px;
			height: auto;
			margin-bottom: -14px;
			margin-left: -6px;
			filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.55));
			animation: zy-float-tilt 5.5s ease-in-out infinite;
		}
		.hero-art-stage {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 440px;
		}
		.hero-art-glow {
			position: absolute;
			inset: -32px;
			background:
				radial-gradient(circle at 48% 42%, rgba(88, 101, 242, 0.65) 0%, transparent 62%),
				radial-gradient(circle at 78% 72%, rgba(235, 69, 158, 0.35) 0%, transparent 55%);
			filter: blur(40px);
			z-index: 0;
			pointer-events: none;
		}
		.hero-3d-composite {
			position: relative;
			z-index: 2;
			width: 100%;
			max-width: 780px;
		}
		.hero-main-devices-img {
			width: 100%;
			height: auto;
			display: block;
			filter: drop-shadow(0 32px 64px rgba(0, 0, 0, 0.65));
		}
		.hero-char-boy {
			position: absolute;
			left: -5%;
			bottom: -4%;
			width: 34%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
			animation: zy-float-y 6.5s ease-in-out infinite;
		}
		.hero-char-girl {
			position: absolute;
			right: -4%;
			top: -6%;
			width: 32%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
			animation: zy-float-y 5.8s ease-in-out infinite 0.8s;
		}
		.hero-char-wumpus {
			position: absolute;
			left: 22%;
			bottom: -8%;
			width: 24%;
			height: auto;
			z-index: 5;
			pointer-events: none;
			filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.58));
		}

		/* Centered Hero Bottom CTA Bar (Exact Discord.com layout) */
		.hero-bottom-ctas {
			display: flex;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
			gap: 20px;
			margin-top: 52px;
			position: relative;
			z-index: 5;
		}
		.hero-bottom-ctas .zy-btn {
			font-size: 18px;
			padding: 18px 32px;
			border-radius: 16px;
		}

		/* Final Bottom Horizon Section */
		.final-horizon-section {
			padding-top: 64px;
			position: relative;
			overflow: hidden;
			text-align: center;
		}
		.final-horizon-art {
			position: relative;
			margin-top: 36px;
			width: 100%;
			max-width: 1440px;
			margin-left: auto;
			margin-right: auto;
		}
		.final-horizon-bg {
			width: 100%;
			height: auto;
			display: block;
		}
		.final-horizon-wumpus {
			position: absolute;
			left: 50%;
			bottom: 8%;
			transform: translateX(-50%);
			width: clamp(160px, 20vw, 290px);
			height: auto;
			z-index: 3;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.55));
		}
		.final-horizon-leaf {
			position: absolute;
			left: 38%;
			bottom: 14%;
			width: clamp(90px, 11vw, 155px);
			height: auto;
			z-index: 2;
			pointer-events: none;
		}

		@media (max-width: 980px) {
			.hero-grid {
				grid-template-columns: 1fr;
				text-align: center;
			}
			.hero-copy {
				align-items: center;
			}
		}
		@media (max-width: 580px) {
			.hero-bottom-ctas .zy-btn {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<!-- Global Discord 2026 Mega-Dropdown Navbar (Rendered via JSX) -->
	<header data-zy-navbar></header>

	<!-- Homepage JSX Mount Point -->
	<main data-zy-jsx-page="home"></main>

	<!-- Global Discord 2026 Blurple Footer (Rendered via JSX) -->
	<footer data-zy-footer></footer>

	<script src="/site/site.js"></script>
</body>
</html>
