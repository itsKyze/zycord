<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>__INSTANCE_NAME__ — Group Chat That's All Fun &amp; Games</title>
	<meta name="description" content="__INSTANCE_NAME__ is great for playing games and chilling with friends, or even building a worldwide community. Customize your own space to talk, play, and hang out." />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="stylesheet" href="/site/site.css" />
	<style>
		/* ============================================================================
		   OFFICIAL DISCORD 2026 3D HERO COMPOSITE & HORIZON STYLES
		   ============================================================================ */
		.hero-section {
			padding: 48px 0 96px;
			position: relative;
			overflow: hidden;
		}
		.hero-grid {
			display: grid;
			grid-template-columns: 0.72fr 1.48fr;
			gap: 32px;
			align-items: center;
			position: relative;
			z-index: 2;
		}
		.hero-copy {
			display: flex;
			flex-direction: column;
			gap: 24px;
			position: relative;
			z-index: 3;
		}
		.hero-crown-wrap {
			position: relative;
			height: 54px;
		}
		.hero-crown {
			position: absolute;
			left: 34%;
			top: -64px;
			width: clamp(130px, 11vw, 174px);
			height: auto;
			filter: blur(2px) drop-shadow(0 16px 28px rgba(0, 0, 0, 0.55));
			opacity: 0.88;
			pointer-events: none;
		}
		.hero-art-stage {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: clamp(500px, 42vw, 680px);
		}
		.hero-art-glow {
			position: absolute;
			inset: -40px;
			background:
				radial-gradient(circle at 48% 42%, rgba(88, 101, 242, 0.65) 0%, transparent 62%),
				radial-gradient(circle at 78% 72%, rgba(235, 69, 158, 0.35) 0%, transparent 55%);
			filter: blur(44px);
			z-index: 0;
			pointer-events: none;
		}
		.hero-3d-composite {
			position: relative;
			z-index: 2;
			width: 100%;
			max-width: 1020px;
		}
		.hero-main-devices-img {
			width: 100%;
			height: auto;
			display: block;
			filter: drop-shadow(0 32px 64px rgba(0, 0, 0, 0.65));
		}
		.hero-char-girl {
			position: absolute;
			left: -3%;
			bottom: -2.5%;
			width: 19.5%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
		}
		.hero-char-clyde-wrap {
			position: absolute;
			left: 36.2%;
			bottom: 1.5%;
			width: 10.2%;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 5px;
			z-index: 5;
			pointer-events: none;
		}
		.hero-char-clyde {
			width: 100%;
			height: auto;
			filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.58));
			animation: hero-clyde-bob 3.8s ease-in-out infinite;
		}
		.hero-char-clyde-shadow {
			width: 86%;
			height: 3px;
			opacity: 0.72;
			animation: hero-clyde-shadow-pulse 3.8s ease-in-out infinite;
		}
		.hero-char-wumpus {
			position: absolute;
			left: 47.6%;
			bottom: -0.5%;
			width: 17.5%;
			height: auto;
			z-index: 5;
			pointer-events: none;
			filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.58));
		}
		.hero-char-wumpus-leaf {
			position: absolute;
			left: 51.8%;
			bottom: 22.8%;
			width: 7.8%;
			height: auto;
			z-index: 6;
			pointer-events: none;
			animation: hero-leaf-float 4.2s ease-in-out infinite;
		}
		.hero-char-boy {
			position: absolute;
			right: 1.8%;
			bottom: -0.5%;
			width: 14.8%;
			height: auto;
			z-index: 4;
			pointer-events: none;
			filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.6));
		}
		.hero-trophy-blur {
			position: absolute;
			right: -7%;
			top: 32%;
			width: clamp(145px, 12vw, 195px);
			height: auto;
			z-index: 1;
			pointer-events: none;
			filter: blur(3px) drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
			opacity: 0.84;
		}
		@keyframes hero-clyde-bob {
			0%, 100% { transform: translate3d(0, -10px, 0); }
			50% { transform: translate3d(0, 2px, 0); }
		}
		@keyframes hero-clyde-shadow-pulse {
			0%, 100% { transform: scaleX(0.84); opacity: 0.55; }
			50% { transform: scaleX(1.06); opacity: 0.88; }
		}
		@keyframes hero-leaf-float {
			0%, 100% { transform: translate3d(0, 0px, 0) rotate(-3deg); }
			50% { transform: translate3d(0, -7px, 0) rotate(4deg); }
		}

		/* Centered Hero Bottom CTA Bar (Exact Discord.com layout) */
		.hero-bottom-ctas {
			display: flex;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
			gap: 24px;
			margin-top: 56px;
			position: relative;
			z-index: 5;
		}
		.hero-bottom-ctas .zy-btn {
			font-size: 20px;
			padding: 20px 36px;
			border-radius: 18px;
		}

		/* Final Bottom Horizon Section */
		.final-horizon-section {
			padding-top: 84px;
			padding-bottom: 0;
			position: relative;
			overflow: visible;
			text-align: center;
			z-index: 7;
			pointer-events: none;
		}
		.final-horizon-section .zy-container,
		.final-horizon-section .zy-btn {
			pointer-events: auto;
		}
		.final-horizon-art {
			position: relative;
			margin-top: 38px;
			margin-bottom: -18px;
			width: 100%;
			max-width: 1420px;
			margin-left: auto;
			margin-right: auto;
			z-index: 8;
		}
		.final-horizon-bg {
			width: 100%;
			height: auto;
			display: block;
			position: relative;
			z-index: 2;
		}
		.final-horizon-clyde {
			position: absolute;
			left: 8.5%;
			bottom: 2.2%;
			width: clamp(92px, 8.2vw, 132px);
			height: auto;
			z-index: 4;
			pointer-events: none;
			transform: scaleX(-1);
			filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.52));
		}
		.final-horizon-wumpus {
			position: absolute;
			left: 49.5%;
			bottom: -9.5%;
			transform: translateX(-50%);
			width: clamp(174px, 15vw, 232px);
			height: auto;
			z-index: 9;
			pointer-events: none;
			filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.6));
		}
		.final-horizon-leaf {
			position: absolute;
			left: 49.2%;
			bottom: 28.5%;
			width: clamp(96px, 8.6vw, 138px);
			height: auto;
			z-index: 10;
			pointer-events: none;
			animation: horizon-leaf-float 4.2s ease-in-out infinite;
		}
		.final-horizon-smoke {
			position: absolute;
			left: 12.2%;
			bottom: 21%;
			width: clamp(68px, 6.8vw, 104px);
			height: auto;
			z-index: 3;
			pointer-events: none;
			opacity: 0;
		}
		@keyframes horizon-leaf-float {
			0%, 100% { transform: translate3d(-50%, 0px, 0) rotate(-3deg); }
			50% { transform: translate3d(-50%, -6px, 0) rotate(4deg); }
		}

		@media (max-width: 980px) {
			.hero-grid {
				grid-template-columns: 1fr;
				text-align: center;
			}
			.hero-copy {
				align-items: center;
			}
		}
		@media (max-width: 580px) {
			.hero-bottom-ctas .zy-btn {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<!-- Global Discord 2026 Mega-Dropdown Navbar (Rendered via JSX) -->
	<header data-zy-navbar></header>

	<!-- Homepage JSX Mount Point -->
	<main data-zy-jsx-page="home"></main>

	<!-- Global Discord 2026 Blurple Footer (Rendered via JSX) -->
	<footer data-zy-footer></footer>

	<script src="/site/site.js"></script>
</body>
</html>
