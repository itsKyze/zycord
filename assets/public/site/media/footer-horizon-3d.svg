<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none">
  <defs>
    <linearGradient id="skyGlow" x1="720" y1="0" x2="720" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0F2D" stop-opacity="0"/>
      <stop offset="45%" stop-color="#1E236E" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3442D9"/>
    </linearGradient>
    <linearGradient id="planetSurface" x1="720" y1="180" x2="720" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A56E2"/>
