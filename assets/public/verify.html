<!doctype html>

		<style>

			:root {

				--font-display: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;

			html,

			/* Full-screen characterBackground_eb4069 */
			.characterBackground_eb4069 {
				position: relative;
				width: 100vw;
				height: 100vh;
				overflow: hidden;
				background-color: #000000;
			}

			/* PulseGradient container (MOD 426660 + CSS 630279) */
			.pulseGradient__11664 {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				overflow: hidden;

			.pulseGradient__11664 svg {
				position: absolute;
				bottom: 0;
				left: 0;
				width: 100%;
				height: 100%;

			}

			@keyframes pulseBackgroundDark {
				0%,
				100% {

			}

			@keyframes pulseBackgroundLight {
				0%,
				100% {

				50% {
					opacity: 0.32;
				}
			}

			@keyframes pulseForegroundRing {
				0%,
				100% {
					opacity: 0.9;
					transform: scale(1);
				}
				50% {
					opacity: 0.65;
					transform: scale(1.02);
				}
			}

			@keyframes pulseForeground {
				0%,
				100% {
					opacity: 0.95;
				}
				50% {
					opacity: 0.72;
				}
			}

			.pulseBackgroundDark__11664 {
				animation: pulseBackgroundDark 6s ease-in-out infinite;
			}

			.pulseBackgroundLight__11664 {
				animation: pulseBackgroundLight 6s ease-in-out infinite;
			}

			.pulseForegroundRing__11664 {
				transform-origin: 500px 1000px;
				animation: pulseForegroundRing 4s ease-in-out infinite;
			}

			.pulseForeground__11664 {
				animation: pulseForeground 4s ease-in-out infinite;

			/* Top-left logoWithText_eb4069 (48px top/left, 124x24) */
			.logoWithText_eb4069 {
				position: fixed;
				top: 48px;

			.logoWithText_eb4069 img {

			}

			@media (max-width: 485px) {
				.logoWithText_eb4069 {

			}

			/* Centered wrapper_b97385 */
			.wrapper_b97385 {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				display: flex;

			.animatedDiv_b97385 {

				display: flex;

				justify-content: center;

			/* authBox__921c5 container__492b5 — transparent on /verify */
			.authBox__921c5.container__492b5 {

				max-width: 100%;

				background-color: transparent;

			.centeringWrapper__921c5 {

			/* Mana stack_dbd263 */
			.stack_dbd263 {

			.stack-gap-24 {

			.image__492b5 {

			/* Typography (heading-xl/semibold & text-md/normal) */
			.heading-xl-semibold {

				font-size: 24px;
				line-height: 30px;

				color: var(--text-strong);

				margin: 0;
			}

			.subtitle__492b5 {
				font-family: var(--font-primary);
				font-size: 16px;
				line-height: 20px;
				font-weight: 400;
				color: var(--text-default);
				text-align: center;
			}

			/* Mana overlay-primary button (button_a22cb0 md_a22cb0 overlay-primary_a22cb0) */
			.button_a22cb0 {
				position: relative;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				background-color: #ffffff;
				color: #000000;
				border: 1px solid rgba(151, 151, 159, 0.12);
				border-radius: 8px;
				min-height: 40px;
				padding: 7px 15px;
				font-family: var(--font-primary);
				font-size: 16px;
				line-height: 20px;
				font-weight: 500;
				cursor: pointer;
				text-decoration: none;
				transition:
					background-color 0.15s ease,
					border-color 0.15s ease,
					color 0.15s ease;
			}

			.button_a22cb0:hover {
				background-color: #e5e5e7;
			}

			.button_a22cb0:active {
				background-color: #d7d7da;
			}

			.buttonChildrenWrapper_a22cb0 {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0 1px;
			}

			.buttonChildren_a22cb0 {
				display: flex;
				align-items: center;
				justify-content: center;
				white-space: nowrap;
			}

			/* Discord SPINNING_CIRCLE Spinner (.spinningCircle__46696) */
			.spinningCircle__46696 {
				width: 32px;
				height: 32px;
				position: relative;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}

			.spinningCircleInner__46696 {
				width: 100%;
				height: 100%;
				transform: rotate(280deg);
			}

			.circular__46696 {
				animation: spinner-rotate 2s linear infinite;
				height: 100%;
				width: 100%;
				transform-origin: center center;
			}

			.path__46696 {
				stroke-dasharray: 1, 200;
				stroke-dashoffset: 0;
				animation: spinner-dash 2s ease-in-out infinite;
				stroke-linecap: round;
				stroke-width: 6;
				stroke: var(--brand-500);
				fill: none;
			}

			.path2__46696 {
				stroke: var(--brand-500);
				opacity: 0.6;
				animation-delay: 0.15s;
			}

			.path3__46696 {
				stroke: var(--brand-500);
				opacity: 0.3;
				animation-delay: 0.23s;
			}

			@keyframes spinner-rotate {
				100% {
					transform: rotate(360deg);
				}
			}

			@keyframes spinner-dash {
				0% {
					stroke-dasharray: 1, 200;
					stroke-dashoffset: 0;
				}
				50% {
					stroke-dasharray: 89, 200;
					stroke-dashoffset: -35px;
				}
				100% {
					stroke-dasharray: 89, 200;
					stroke-dashoffset: -124px;
				}
			}
		</style>
	</head>
	<body>
		<div class="characterBackground_eb4069">
			<!-- Official Discord PulseGradient (MOD 426660) -->
			<div class="pulseGradient__11664" aria-hidden="true">
				<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" fill="none" preserveAspectRatio="none" viewBox="0 0 1000 1000">
					<g clip-path="url(#pulse_clip)">
						<path fill="#000000" d="M1000 0H0v1000h1000V0Z" />
						<g id="pulseGroupDark" class="pulseBackgroundDark__11664" filter="url(#pulse_filter_b)" opacity=".8">
							<path fill="#201E6E" d="M500 1922.1c349.485 0 632.8-379.26 632.8-847.1 0-467.841-283.315-847.101-632.8-847.101-349.486 0-632.8 379.26-632.8 847.101 0 467.84 283.314 847.1 632.8 847.1Z" />
						</g>
						<g id="pulseGroupLight" class="pulseBackgroundLight__11664" filter="url(#pulse_filter_c)" opacity=".5">
							<path fill="#EB459E" d="M500 1428c177.283 0 321-179.98 321-402 0-222.018-143.717-402-321-402s-321 179.982-321 402c0 222.02 143.717 402 321 402Z" />
						</g>
						<g id="pulseGroupRing" class="pulseForegroundRing__11664" filter="url(#pulse_filter_d)">
							<path stroke="#5865F2" stroke-width="14.648" d="M500 1664.5c368.098 0 666.5-298.4 666.5-666.5 0-368.098-298.402-666.5-666.5-666.5S-166.5 629.902-166.5 998c0 368.1 298.402 666.5 666.5 666.5Z" />
						</g>
						<g id="pulseGroupFg" class="pulseForeground__11664" filter="url(#pulse_filter_e)">
							<path fill="#5865F2" d="M500 1379c166.79 0 302-123.35 302-275.5C802 951.346 666.79 828 500 828s-302 123.346-302 275.5c0 152.15 135.21 275.5 302 275.5Z" />
						</g>
					</g>
					<defs>
						<filter id="pulse_filter_b" width="1753.88" height="2182.48" x="-376.941" y="-16.241" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
							<feFlood flood-opacity="0" result="BackgroundImageFix" />
							<feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
							<feGaussianBlur result="effect1_foregroundBlur" stdDeviation="122.07" />
						</filter>
						<filter id="pulse_filter_c" width="1227.94" height="1389.94" x="-113.969" y="331.031" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
							<feFlood flood-opacity="0" result="BackgroundImageFix" />
							<feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
							<feGaussianBlur result="effect1_foregroundBlur" stdDeviation="146.484" />
						</filter>
						<filter id="pulse_filter_d" width="1738.27" height="1738.27" x="-369.137" y="128.863" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
							<feFlood flood-opacity="0" result="BackgroundImageFix" />
							<feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
							<feGaussianBlur result="effect1_foregroundBlur" stdDeviation="97.656" />
						</filter>
						<filter id="pulse_filter_e" width="1287.59" height="1234.59" x="-143.797" y="486.203" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
							<feFlood flood-opacity="0" result="BackgroundImageFix" />
							<feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
							<feGaussianBlur result="effect1_foregroundBlur" stdDeviation="170.898" />
						</filter>
						<clipPath id="pulse_clip">
							<path fill="#ffffff" d="M0 0h1000v1000H0z" />
						</clipPath>
					</defs>
				</svg>
			</div>

			<!-- Top-left brand logo (.logoWithText_eb4069) -->
			<a class="logoWithText_eb4069" href="/" aria-label="Zycord">
				<img src="/static/branding/zycord_logo_white.svg" onerror="this.onerror=null;this.src='/static/branding/zycord_logo_white.png'" alt="Zycord" />
			</a>

			<!-- Centered AuthBox (.wrapper_b97385 -> .authBox__921c5.container__492b5) -->
			<div class="wrapper_b97385">
				<div class="animatedDiv_b97385">
					<section data-theme="darker" class="authBox__921c5 container__492b5">
						<div class="centeringWrapper__921c5" id="verifyMount"></div>
					</section>
				</div>
			</div>
		</div>

		<script>
			(() => {
				const verifyMount = document.getElementById("verifyMount");

				// Subtle interactive pointer drift on PulseGradient layers (matching Discord Rive stateMachine)
				const fgGroup = document.getElementById("pulseGroupFg");
				const lightGroup = document.getElementById("pulseGroupLight");
				let targetX = 0,
					targetY = 0,
					curX = 0,
					curY = 0;

				window.addEventListener("mousemove", (e) => {
					const nx = e.clientX / window.innerWidth - 0.5;
					const ny = e.clientY / window.innerHeight - 0.5;
					targetX = nx * 28;
					targetY = ny * 18;
				});

				window.addEventListener("mouseleave", () => {
					targetX = 0;
					targetY = 0;
				});

				function tickGradient() {
					curX += (targetX - curX) * 0.04;
					curY += (targetY - curY) * 0.04;
					if (fgGroup) {
						fgGroup.setAttribute("transform", `translate(${curX.toFixed(2)}, ${curY.toFixed(2)})`);
					}
					if (lightGroup) {
						lightGroup.setAttribute("transform", `translate(${(curX * -0.6).toFixed(2)}, ${(curY * -0.6).toFixed(2)})`);
					}
					requestAnimationFrame(tickGradient);
				}
				requestAnimationFrame(tickGradient);

				// Render function matching eF(props) in Discord chunk 786142
				function renderVerifyBox({ title, subtitle, buttonText, onButtonClick, loading = false, showEnvelope = false }) {
					const imageHtml = showEnvelope
						? `<div class="stack_dbd263 image__492b5">
								<img src="/static/branding/zycord_envelope.svg" onerror="this.onerror=null;this.src='/static/branding/zycord_envelope.png'" alt="${title}" width="288" height="162" />
						   </div>`
						: "";

					const spinnerHtml = loading
						? `<div class="spinningCircle__46696" role="img" aria-label="Loading">
								<div class="spinningCircleInner__46696">
									<svg class="circular__46696" viewBox="25 25 50 50">
										<circle class="path__46696 path3__46696" cx="50" cy="50" r="20"></circle>
										<circle class="path__46696 path2__46696" cx="50" cy="50" r="20"></circle>
										<circle class="path__46696" cx="50" cy="50" r="20"></circle>
									</svg>
								</div>
						   </div>`
						: "";

					const subtitleHtml =
						subtitle != null && subtitle !== ""
							? `<div class="subtitle__492b5" data-text-variant="text-md/normal">${subtitle}</div>`
							: "";

					const buttonHtml = !loading
						? `<button data-mana-component="button" role="button" class="button_a22cb0" type="button" id="verifyActionBtn">
								<div class="buttonChildrenWrapper_a22cb0">
									<div class="buttonChildren_a22cb0">
										<span>${buttonText}</span>
									</div>
								</div>
						   </button>`
						: "";

					verifyMount.innerHTML = `
						<div class="stack_dbd263 stack-gap-24" data-align="center" data-justify="center" data-direction="vertical">
							<div class="stack_dbd263 stack-gap-8" data-align="center" data-justify="start" data-direction="vertical">
								<div class="stack_dbd263 stack-gap-24" data-align="center" data-justify="start" data-direction="vertical">
									${imageHtml}
									${spinnerHtml}
									<h1 class="heading-xl-semibold" data-text-variant="heading-xl/semibold">${title}</h1>
								</div>
								${subtitleHtml}
							</div>
							${buttonHtml}
						</div>
					`;

					if (!loading && typeof onButtonClick === "function") {
						const btn = document.getElementById("verifyActionBtn");
						if (btn) btn.addEventListener("click", onButtonClick);
					}
				}

				// Extract token from #token=... or ?token=...
				const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
				const searchParams = new URLSearchParams(location.search);
				const verifyToken = hashParams.get("token") || searchParams.get("token");
				const urlType = hashParams.get("type") || searchParams.get("type");

				let tokenPayload = null;
				if (verifyToken) {
					try {
						const parts = verifyToken.split(".");
						if (parts.length >= 2) {
							const jsonStr = atob(parts[1].replace(/-/g, "+").replace(/_/g, "/"));
							tokenPayload = JSON.parse(jsonStr);
						}
					} catch (e) {}
				}

				const isLogin = urlType === "login" || tokenPayload?.typ === "login_verify" || tokenPayload?.typ === "login";

				const goLogin = () => {
					location.href = "/login";
				};

				const goApp = () => {
					location.href = "/channels/@me";
				};

				const showFailed = () => {
					renderVerifyBox({
						title: isLogin ? "Login verification link has expired." : "Email verification link has expired.",
						subtitle: "Please log in and resend the link.",
						buttonText: "Log In",
						onButtonClick: goLogin,
						loading: false,
						showEnvelope: false,
					});
				};

				const showSucceeded = () => {
					renderVerifyBox({
						title: isLogin ? "Login Verified!" : "Email Verified!",
						subtitle: "",
						buttonText: "Continue to Zycord",
						onButtonClick: goApp,
						loading: false,
						showEnvelope: true,
					});
				};

				// Exact Discord rr component logic: if null == token -> immediately set state to "failed"
				if (!verifyToken) {
					showFailed();
					return;
				}

				// Otherwise start in "submitting" state and call /api/v9/auth/verify
				renderVerifyBox({
					title: isLogin ? "Verifying your login" : "Verifying your email",
					subtitle: "This may take a moment.",
					loading: true,
				});

				(async () => {
					const minDelay = new Promise((resolve) => setTimeout(resolve, 600));
					try {
						let localAuthToken = null;
						try {
							localAuthToken = JSON.parse(localStorage.getItem("token") ?? "null");
						} catch {}

						const fetchPromise = fetch("/api/v9/auth/verify", {
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								...(localAuthToken ? { Authorization: localAuthToken } : {}),
							},
							body: JSON.stringify({ token: verifyToken }),
						});

						const [response] = await Promise.all([fetchPromise, minDelay]);
						const data = await response.json().catch(() => ({}));

						if (response.ok) {
							if (data.token && !localAuthToken) {
								localStorage.setItem("token", JSON.stringify(data.token));
							}
							showSucceeded();
						} else {
							showFailed();
						}
					} catch (err) {
						await minDelay;
						showFailed();
					}
				})();
			})();
		</script>
	</body>
</html>
