<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Zycord</title>
		<link rel="icon" href="/static/branding/favicon.svg" type="image/svg+xml" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html, body {
				height: 100%;
				width: 100%;
			}
			body {
				color: #ffffff;
				font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				position: relative;
				overflow: hidden;
				-webkit-font-smoothing: antialiased;
				perspective: 1000px;
			}

			/* Blue/purple gradient theme for Gmail email verification (Matches real Discord verify page) */
			body.theme-email {
				background-color: #0b0e22;
				background-image: radial-gradient(circle 800px at 68% 68%, #3648b7 0%, #233082 28%, #141b4f 55%, #0c1032 75%, #060818 100%);
			}

			/* Pitch black theme for login authorization (Matches real Discord verify page) */
			body.theme-login {
				background-color: #000000 !important;
				background-image: none !important;
			}

			/* Top-left Zycord logo header — positioned fixed so stage stays dead-center */
			.header {
				position: absolute;
				top: 24px;
				left: 24px;
				z-index: 10;
			}
			.brand {
				display: inline-block;
				text-decoration: none;
			}
			.brand img {
				height: 24px;
				width: auto;
				display: block;
			}

			/* Centered main stage */
			.main-content {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 20px;
				z-index: 2;
				pointer-events: auto;
			}

			/* Envelope 3D illustration container */
			.illustration {
				width: 140px;
				height: 116px;
				margin-bottom: 24px;
				display: flex;
				align-items: center;
				justify-content: center;
				animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
				perspective: 800px;
			}
			.illustration img {
				width: 140px;
				height: auto;
				display: block;
				filter: drop-shadow(0 14px 34px rgba(88, 101, 242, 0.45));
				transform-style: preserve-3d;
				will-change: transform;
			}

			@keyframes popIn {
				from { transform: scale(0.7); opacity: 0; }
				to   { transform: scale(1);   opacity: 1; }
			}

			/* Headings */
			.title {
				font-size: 20px;
				font-weight: 600;
				line-height: 24px;
				color: #f2f3f5;
				margin-bottom: 8px;
			}
			.subtitle {
				font-size: 14px;
				font-weight: 400;
				color: #949ba4;
				max-width: 420px;
				line-height: 20px;
				margin-bottom: 24px;
			}

			/* Button — matches Discord standard: pure white, dark text, subtle 3px radius */
			.btn {
				background-color: #ffffff;
				color: #060607;
				font-size: 14px;
				font-weight: 500;
				line-height: 16px;
				padding: 2px 20px;
				min-height: 38px;
				min-width: 96px;
				border-radius: 3px;
				border: none;
				cursor: pointer;
				text-decoration: none;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				font-family: inherit;
				transition: background-color 0.17s ease, color 0.17s ease;
			}
			.btn:hover {
				background-color: #e3e5e8;
			}
			.btn:active {
				background-color: #c7c8ce;
			}

			/* Subtle circular spinner matching Discord's loading state */
			.spinner {
				width: 24px;
				height: 24px;
				border: 2.5px solid rgba(88, 101, 242, 0.25);
				border-top-color: #5865f2;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				margin-bottom: 20px;
			}
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
		</style>
	</head>
	<body class="theme-email">
		<header class="header">
			<a class="brand" href="/channels/@me">
				<img src="/static/branding/zycord_logo_white.svg" onerror="this.onerror=null;this.src='/static/branding/zycord_logo_white.png'" alt="Zycord" />
			</a>
		</header>

		<main class="main-content" id="stage">
			<div class="spinner" id="spinner"></div>
			<h1 class="title" id="title">Verifying your email</h1>
			<p class="subtitle" id="subtitle">This may take a moment.</p>
		</main>

		<script>
			// Smooth slow mouse-follow / parallax interaction matching Discord
			let targetBgX = 68;
			let targetBgY = 68;
			let currentBgX = 68;
			let currentBgY = 68;

			let targetTiltX = 0;
			let targetTiltY = 0;
			let currentTiltX = 0;
			let currentTiltY = 0;

			window.addEventListener("mousemove", (e) => {
				const normX = e.clientX / window.innerWidth;
				const normY = e.clientY / window.innerHeight;

				// Background radial light target shifts slowly around cursor
				targetBgX = 68 + (normX - 0.5) * 22;
				targetBgY = 68 + (normY - 0.5) * 22;

				// 3D illustration tilt angles
				const centerX = window.innerWidth / 2;
				const centerY = window.innerHeight / 2;
				const deltaX = (e.clientX - centerX) / centerX;
				const deltaY = (e.clientY - centerY) / centerY;

				targetTiltX = deltaX * 12;  // rotateY degrees
				targetTiltY = -deltaY * 12; // rotateX degrees
			});

			window.addEventListener("mouseleave", () => {
				targetBgX = 68;
				targetBgY = 68;
				targetTiltX = 0;
				targetTiltY = 0;
			});

			function renderParallax() {
				// Gentle smooth lerp (factor 0.045 for that slow, luxurious Discord fluid motion)
				currentBgX += (targetBgX - currentBgX) * 0.045;
				currentBgY += (targetBgY - currentBgY) * 0.045;
				currentTiltX += (targetTiltX - currentTiltX) * 0.055;
				currentTiltY += (targetTiltY - currentTiltY) * 0.055;

				if (document.body.classList.contains("theme-email")) {
					document.body.style.backgroundImage = `radial-gradient(circle 800px at ${currentBgX.toFixed(2)}% ${currentBgY.toFixed(2)}%, #3648b7 0%, #233082 28%, #141b4f 55%, #0c1032 75%, #060818 100%)`;
				}

				const img = document.querySelector(".illustration img");
				if (img) {
					img.style.transform = `perspective(800px) rotateX(${currentTiltY.toFixed(2)}deg) rotateY(${currentTiltX.toFixed(2)}deg) translate3d(${(currentTiltX * 1.2).toFixed(2)}px, ${(-currentTiltY * 1.2).toFixed(2)}px, 0)`;
				}

				requestAnimationFrame(renderParallax);
			}
			requestAnimationFrame(renderParallax);

			(async () => {
				const stage    = document.getElementById("stage");
				const title    = document.getElementById("title");
				const subtitle = document.getElementById("subtitle");

				// Extract query and hash parameters
				const hashParams   = new URLSearchParams(location.hash.replace(/^#/, ""));
				const searchParams = new URLSearchParams(location.search);
				const verifyToken  = hashParams.get("token") || searchParams.get("token");
				const urlType      = hashParams.get("type") || searchParams.get("type");

				// Detect token payload to determine theme (login vs email)
				let tokenPayload = null;
				if (verifyToken) {
					try {
						const parts = verifyToken.split(".");
						if (parts.length >= 2) {
							const jsonStr = atob(parts[1].replace(/-/g, "+").replace(/_/g, "/"));
							tokenPayload = JSON.parse(jsonStr);
						}
					} catch (e) {}
				}

				const isLogin = urlType === "login" || tokenPayload?.typ === "login_verify" || tokenPayload?.typ === "login";

				// Apply appropriate theme based on verification type
				if (isLogin) {
					document.body.classList.remove("theme-email");
					document.body.classList.add("theme-login");
					title.textContent = "Verifying your login";
					subtitle.textContent = "This may take a moment.";
				} else {
					document.body.classList.remove("theme-login");
					document.body.classList.add("theme-email");
					title.textContent = "Verifying your email";
					subtitle.textContent = "This may take a moment.";
				}

				// Helper functions for rendering states
				const showSuccess = () => {
					stage.innerHTML = `
						<div class="illustration">
							<img src="/static/branding/zycord_envelope.png" onerror="this.onerror=null;this.src='/static/zycord_envelope.png'" alt="Verified" />
						</div>
						<h1 class="title">Email Verified!</h1>
						<button class="btn" id="continueBtn">Continue to Zycord</button>
					`;
					document.getElementById("continueBtn").addEventListener("click", () => {
						location.href = "/channels/@me";
					});
				};

				const showExpired = (message) => {
					stage.innerHTML = `
						<h1 class="title">${isLogin ? "Login verification link has expired." : "Email verification link has expired."}</h1>
						<p class="subtitle">${message || (isLogin ? "Please try logging in again to receive a new link." : "Please log in and resend the link.")}</p>
						<button class="btn" id="loginBtn">Log In</button>
					`;
					document.getElementById("loginBtn").addEventListener("click", () => {
						location.href = "/login";
					});
				};

				if (!verifyToken) {
					// No token provided in URL
					await new Promise((r) => setTimeout(r, 600));
					showExpired("No verification token was provided.");
					return;
				}

				// Enforce minimum loading time (1200ms) so user sees the authentic "Verifying your email" state first
				const minDelay = new Promise((resolve) => setTimeout(resolve, 1200));

				try {
					let localAuthToken = null;
					try { localAuthToken = JSON.parse(localStorage.getItem("token") ?? "null"); } catch {}

					const fetchPromise = fetch("/api/v9/auth/verify", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							...(localAuthToken ? { Authorization: localAuthToken } : {}),
						},
						body: JSON.stringify({ token: verifyToken }),
					});

					const [response] = await Promise.all([fetchPromise, minDelay]);
					const data = await response.json().catch(() => ({}));

					if (response.ok) {
						if (data.token && !localAuthToken) {
							localStorage.setItem("token", JSON.stringify(data.token));
						}
						showSuccess();
					} else {
						showExpired(data?.message || data?.token?.message);
					}
				} catch (err) {
					await minDelay;
					showExpired("A network error occurred. Please try again.");
				}
			})();
		</script>
	</body>
</html>
