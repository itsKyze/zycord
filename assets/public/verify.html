<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Zycord</title>
		<link rel="icon" href="/static/branding/favicon.svg" type="image/svg+xml" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html, body {
				height: 100%;
			}
			body {
				/* Matches real Discord verify page gradient exactly */
				background-color: #1a1f4b;
				background-image:
					radial-gradient(ellipse 80% 70% at 85% 100%, #5865f2 0%, #3a44c0 15%, #232966 35%, #131734 60%, #0b0d1e 100%);
				color: #ffffff;
				font-family: 'gg sans', 'Noto Sans', Helvetica, Arial, sans-serif;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				-webkit-font-smoothing: antialiased;
			}
			/* Top-left logo header */
			.header {
				padding: 20px 24px;
				display: flex;
				align-items: center;
				flex-shrink: 0;
			}
			.brand img {
				height: 22px;
				width: auto;
				display: block;
			}
			/* Centered main content */
			.main-content {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 40px 20px 120px;
			}
			/* Envelope illustration */
			.illustration {
				width: 128px;
				height: 128px;
				margin-bottom: 16px;
				display: flex;
				align-items: center;
				justify-content: center;
				animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
			}
			.illustration img {
				width: 128px;
				height: auto;
				display: block;
				filter: drop-shadow(0 8px 24px rgba(88, 101, 242, 0.5));
			}
			@keyframes popIn {
				from { transform: scale(0.6); opacity: 0; }
				to   { transform: scale(1);   opacity: 1; }
			}
			/* "Email Verified!" */
			.title {
				font-size: 20px;
				font-weight: 600;
				line-height: 24px;
				color: #ffffff;
				margin-bottom: 16px;
			}
			.subtitle {
				font-size: 14px;
				color: #b5bac1;
				max-width: 380px;
				line-height: 20px;
				margin-bottom: 20px;
			}
			/* Button — matches real Discord: white bg, dark text, small radius */
			.btn {
				background-color: #ffffff;
				color: #060607;
				font-size: 14px;
				font-weight: 500;
				line-height: 16px;
				padding: 8px 16px;
				border-radius: 3px;
				border: none;
				cursor: pointer;
				text-decoration: none;
				display: inline-block;
				font-family: inherit;
				transition: background-color 0.15s ease, box-shadow 0.15s ease;
				min-width: 130px;
			}
			.btn:hover {
				background-color: #e3e5e8;
			}
			.btn:active {
				background-color: #c7c8ce;
			}
			/* Loading spinner */
			.spinner {
				width: 40px;
				height: 40px;
				border: 3px solid rgba(255, 255, 255, 0.12);
				border-top-color: #ffffff;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				margin-bottom: 20px;
			}
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
		</style>
	</head>
	<body>
		<header class="header">
			<a href="/channels/@me">
				<img src="/static/branding/zycord_logo_white.png" alt="Zycord" />
			</a>
		</header>

		<main class="main-content" id="stage">
			<div class="spinner" id="spinner"></div>
			<h1 class="title" id="title">Verifying email…</h1>
			<p class="subtitle" id="subtitle">Please wait while we confirm your email address.</p>
			<div id="actionContainer" style="display:none;"></div>
		</main>

		<script>
			(async () => {
				const title           = document.getElementById("title");
				const subtitle        = document.getElementById("subtitle");
				const spinner         = document.getElementById("spinner");
				const actionContainer = document.getElementById("actionContainer");
				const stage           = document.getElementById("stage");

				const hashParams  = new URLSearchParams(location.hash.replace(/^#/, ""));
				const searchParams = new URLSearchParams(location.search);
				const verifyToken = hashParams.get("token") || searchParams.get("token");

				const showSuccess = () => {
					stage.innerHTML = `
						<div class="illustration">
							<img src="/static/branding/zycord_envelope.png" alt="Email Verified" />
						</div>
						<h1 class="title">Email Verified!</h1>
						<button class="btn" id="continueBtn">Continue to Zycord</button>
					`;
					document.getElementById("continueBtn").addEventListener("click", () => {
						location.href = "/channels/@me";
					});
				};

				const showError = (message) => {
					spinner.style.display = "none";
					title.textContent    = "Email Verification Failed";
					subtitle.textContent = message || "This link is invalid or has expired. Please request a new verification email from your account settings.";
					actionContainer.style.display = "block";
					actionContainer.innerHTML     = `<button class="btn" onclick="location.href='/channels/@me'">Continue to Zycord</button>`;
				};

				if (!verifyToken) {
					showError("No verification token was provided in the link.");
					return;
				}

				try {
					let localAuthToken = null;
					try { localAuthToken = JSON.parse(localStorage.getItem("token") ?? "null"); } catch {}

					const response = await fetch("/api/v9/auth/verify", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							...(localAuthToken ? { Authorization: localAuthToken } : {}),
						},
						body: JSON.stringify({ token: verifyToken }),
					});

					const data = await response.json().catch(() => ({}));

					if (response.ok) {
						if (data.token && !localAuthToken) {
							localStorage.setItem("token", JSON.stringify(data.token));
						}
						showSuccess();
					} else {
						showError(data?.token?.message || data?.message);
					}
				} catch {
					showError("A network error occurred while verifying. Please try again.");
				}
			})();
		</script>
	</body>
</html>
