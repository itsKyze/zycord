<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Zycord</title>
		<link rel="icon" href="/static/branding/favicon.svg" type="image/svg+xml" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				background: radial-gradient(ellipse at 85% 90%, #29388a 0%, #151b47 35%, #0c0f24 60%, #05060c 100%);
				color: #ffffff;
				font-family: 'gg sans', 'Noto Sans', Helvetica, Arial, sans-serif;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				overflow: hidden;
				-webkit-font-smoothing: antialiased;
			}
			.header {
				padding: 20px 32px;
				display: flex;
				align-items: center;
			}
			.brand {
				display: flex;
				align-items: center;
				text-decoration: none;
				cursor: pointer;
			}
			.brand img {
				height: 24px;
				width: auto;
				display: block;
			}
			.main-content {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 20px;
				margin-top: -60px;
			}
			.illustration {
				width: 160px;
				height: 140px;
				margin-bottom: 20px;
				display: flex;
				align-items: center;
				justify-content: center;
				animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			}
			.illustration img {
				width: 150px;
				height: auto;
				display: block;
				filter: drop-shadow(0px 8px 24px rgba(88, 101, 242, 0.35));
			}
			@keyframes popIn {
				0% {
					transform: scale(0.7);
					opacity: 0;
				}
				100% {
					transform: scale(1);
					opacity: 1;
				}
			}
			.title {
				font-size: 24px;
				font-weight: 700;
				line-height: 30px;
				margin-bottom: 20px;
				color: #ffffff;
			}
			.subtitle {
				font-size: 15px;
				color: #949ba4;
				max-width: 420px;
				line-height: 20px;
				margin-bottom: 24px;
			}
			/* Button matches real Discord - white, black text, small radius */
			.btn {
				background-color: #ffffff;
				color: #060607;
				font-size: 14px;
				font-weight: 500;
				padding: 10px 32px;
				border-radius: 28px;
				border: none;
				cursor: pointer;
				text-decoration: none;
				display: inline-block;
				font-family: inherit;
				letter-spacing: 0.02em;
				transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
			}
			.btn:hover {
				background-color: #e3e5e8;
				opacity: 0.9;
			}
			.btn:active {
				transform: scale(0.97);
			}
			.spinner {
				width: 36px;
				height: 36px;
				border: 3px solid rgba(255, 255, 255, 0.15);
				border-top-color: #ffffff;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				margin-bottom: 20px;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<header class="header">
			<a class="brand" href="/channels/@me">
				<img src="/static/branding/zycord_logo_white.png" alt="Zycord" />
			</a>
		</header>

		<main class="main-content" id="stage">
			<div class="spinner" id="spinner"></div>
			<h1 class="title" id="title">Verifying email…</h1>
			<p class="subtitle" id="subtitle">Please wait while we confirm your email address.</p>
			<div id="actionContainer" style="display: none;"></div>
		</main>

		<script>
			(async () => {
				const title = document.getElementById("title");
				const subtitle = document.getElementById("subtitle");
				const spinner = document.getElementById("spinner");
				const actionContainer = document.getElementById("actionContainer");
				const stage = document.getElementById("stage");

				const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
				const searchParams = new URLSearchParams(location.search);
				const verifyToken = hashParams.get("token") || searchParams.get("token");

				const showSuccess = () => {
					stage.innerHTML = `
						<div class="illustration">
							<img src="/static/branding/zycord_envelope.png" alt="Email Verified" />
						</div>
						<h1 class="title">Email Verified!</h1>
						<div>
							<button class="btn" id="continueBtn">Continue to Zycord</button>
						</div>
					`;

					document.getElementById("continueBtn").onclick = () => {
						location.href = "/channels/@me";
					};
				};

				const showError = (message) => {
					spinner.style.display = "none";
					title.innerText = "Email Verification Failed";
					subtitle.innerText = message || "This link is invalid or has expired. Request a new verification email from your account settings.";
					actionContainer.style.display = "block";
					actionContainer.innerHTML = `<button class="btn" onclick="location.href='/channels/@me'">Continue to Zycord</button>`;
				};

				if (!verifyToken) {
					showError("No verification token was provided in the link.");
					return;
				}

				try {
					let localAuthToken = null;
					try {
						localAuthToken = JSON.parse(localStorage.getItem("token") ?? "null");
					} catch {}

					const response = await fetch("/api/v9/auth/verify", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							...(localAuthToken ? { Authorization: localAuthToken } : {})
						},
						body: JSON.stringify({ token: verifyToken }),
					});

					const data = await response.json().catch(() => ({}));

					if (response.ok) {
						if (data.token && !localAuthToken) {
							localStorage.setItem("token", JSON.stringify(data.token));
						}
						showSuccess();
					} else {
						showError(data?.token?.message || data?.message);
					}
				} catch (err) {
					showError("Network error occurred while verifying. Please try again.");
				}
			})();
		</script>
	</body>
</html>
