<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zycord</title>
  <style>
    @font-face {
      font-family: 'gg sans';
      font-weight: 400;
      src: url('./fonts/ggsans-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'gg sans';
      font-weight: 500;
      src: url('./fonts/ggsans-500-medium.woff2') format('woff2');
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #282b30;
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      cursor: default;
    }
    #splash-container {
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: #ffffff;
      padding-bottom: 25px;
    }
    .video-wrap {
      width: 200px;
      height: 200px;
      margin-bottom: -15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-wrap img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      pointer-events: none;
    }
    .status-text {
      font-size: 16px;
      font-weight: 600;
      margin-top: 5px;
      color: #ffffff;
      min-height: 24px;
      font-variant-numeric: tabular-nums;
    }
    .progress-bar-wrap {
      width: 180px;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      margin-top: 10px;
      overflow: hidden;
      display: none;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #5865f2;
      border-radius: 4px;
      transition: width 0.2s ease;
    }
    .quote-text {
      font-size: 11px;
      color: #8a8e94;
      margin-top: 12px;
      max-width: 250px;
      line-height: 1.4;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .quote-text.fade {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="splash-container">
    <div class="video-wrap">
      <img id="splash-anim" src="./videos/connecting.webp" alt="Loading..." />
    </div>
    <div id="splash-status" class="status-text">Checking for updates...</div>
    <div id="splash-progress-wrap" class="progress-bar-wrap">
      <div id="splash-progress-fill" class="progress-bar-fill"></div>
    </div>
    <div id="splash-quote" class="quote-text">Hang on, connecting to Zycord Voice & Chat...</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const statusEl = document.getElementById('splash-status');
    const progressWrap = document.getElementById('splash-progress-wrap');
    const progressFill = document.getElementById('splash-progress-fill');
    const quoteEl = document.getElementById('splash-quote');

    const QUOTES = [
      "Hang on, connecting to Zycord Voice & Chat...",
      "Upsorbing the Contents",
      "Additive Parsing the Load",
      "Commence Monosaturated Goodening",
      "Kick Off the Multi-Core Widening",
      "Bastening the Game Turkey",
      "Abstracting the Rummage Disc",
      "Undecerealenizing the Process",
      "Postrefragmenting the Widget Layer",
      "Satisfying the Constraints",
      "Abnormalizing Some of the Matrices",
      "Optimizing the People",
      "Proclaigerizing the Network"
    ];

    let quoteIndex = 0;
    setInterval(() => {
      quoteIndex = (quoteIndex + 1) % QUOTES.length;
      quoteEl.classList.add('fade');
      setTimeout(() => {
        quoteEl.textContent = QUOTES[quoteIndex];
        quoteEl.classList.remove('fade');
      }, 300);
    }, 4000);

    ipcRenderer.on('ZYCORD_SPLASH_UPDATE_STATE', (_, state) => {
      if (!state) return;

      if (state.status === 'checking-for-updates') {
        statusEl.textContent = 'Checking for updates...';
        progressWrap.style.display = 'none';
      } else if (state.status === 'downloading-updates') {
        statusEl.textContent = `Downloading update: ${state.progress || 0}%`;
        progressWrap.style.display = 'block';
        progressFill.style.width = (state.progress || 0) + '%';
      } else if (state.status === 'installing-updates') {
        statusEl.textContent = 'Installing update...';
        progressWrap.style.display = 'block';
        progressFill.style.width = '100%';
      } else if (state.status === 'starting') {
        statusEl.textContent = 'Starting Zycord...';
        progressWrap.style.display = 'none';
      } else if (state.message) {
        statusEl.textContent = state.message;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      ipcRenderer.send('ZYCORD_SPLASH_SCREEN_READY');
    });
  </script>
</body>
</html>
