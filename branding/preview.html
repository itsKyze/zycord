<!doctype html>
<meta charset="utf-8">
<title>zycord spinner</title>

<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#313338;--text-strong:#fff">
  <div class="zycord-spinner" role="progressbar" aria-label="Loading"
    style="display:flex;align-items:center;justify-content:center;width:200px;height:200px;margin:0 auto;color:var(--text-strong,var(--header-primary,black))">
    <style>
      @keyframes zycord-spinner-flip {
        0% {
          transform: perspective(500px) translateY(0) rotateY(0) scale(1)
        }

        18% {
          transform: perspective(500px) translateY(2px) rotateY(0) scale(1.12, .86)
        }

        50% {
          transform: perspective(500px) translateY(-18px) rotateY(180deg) scale(.96, 1.06)
        }

        78% {
          transform: perspective(500px) translateY(0) rotateY(360deg) scale(1.1, .9)
        }

        90%,
        100% {
          transform: perspective(500px) translateY(0) rotateY(360deg) scale(1)
        }
      }

      @keyframes zycord-spinner-flare-l {

        0%,
        22%,
        80%,
        100% {
          transform: rotate(0)
        }

        50% {
          transform: rotate(-28deg)
        }
      }

      @keyframes zycord-spinner-flare-r {

        0%,
        22%,
        80%,
        100% {
          transform: rotate(0)
        }

        50% {
          transform: rotate(28deg)
        }
      }

      .zycord-spinner>svg {
        overflow: visible;
        animation: zycord-spinner-flip 1.1s cubic-bezier(.5, 0, .3, 1) infinite;
        transform-origin: 50% 75%
      }

      .zycord-spinner .wl,
      .zycord-spinner .wr {
        transform-box: fill-box
      }

      .zycord-spinner .wl {
        transform-origin: 100% 50%;
        animation: zycord-spinner-flare-l 1.1s ease-in-out infinite
      }

      .zycord-spinner .wr {
        transform-origin: 0% 50%;
        animation: zycord-spinner-flare-r 1.1s ease-in-out infinite
      }

      @media (prefers-reduced-motion:reduce) {

        .zycord-spinner>svg,
        .zycord-spinner path {
          animation: none
        }
      }
