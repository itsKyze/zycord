<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Zycord Updater</title>
        <style>
            * {
                box-sizing: border-box;
                user-select: none;
                -webkit-user-select: none;
            }

            body {
                margin: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                background-color: #2b2d31;
                color: #f2f3f5;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                -webkit-app-region: drag;
            }

            .splash-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 24px;
                width: 240px;
            }

            .logo-wrapper {
                position: relative;
                width: 96px;
                height: 96px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .logo-glow {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(88, 101, 242, 0.4) 0%, transparent 70%);
                animation: pulse-glow 2.5s infinite ease-in-out;
            }

            @keyframes pulse-glow {
                0%, 100% { transform: scale(0.9); opacity: 0.5; }
                50% { transform: scale(1.3); opacity: 1; }
            }

            .spinner-ring {
                position: absolute;
                inset: -6px;
                border-radius: 50%;
                border: 3px solid transparent;
                border-top-color: #5865f2;
                border-right-color: #5865f2;
                animation: spin 1.2s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .logo-icon {
                width: 64px;
                height: 64px;
                border-radius: 18px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                z-index: 2;
                object-fit: cover;
            }

            .status-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .status-text {
                font-size: 12px;
                font-weight: 800;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #b5bac1;
                text-align: center;
                transition: color 0.2s ease;
            }

            .progress-track {
                width: 100%;
                height: 4px;
                background-color: #1e1f22;
                border-radius: 2px;
                overflow: hidden;
                position: relative;
            }

            .progress-bar {
                height: 100%;
                width: 30%;
                background: #5865f2;
                border-radius: 2px;
                position: absolute;
                left: 0;
                animation: indeterminate 1.8s infinite cubic-bezier(0.65, 0, 0.35, 1);
                transition: width 0.3s ease;
            }

            .progress-bar.determinate {
                animation: none;
            }

            @keyframes indeterminate {
                0% { left: -35%; width: 35%; }
                50% { left: 40%; width: 60%; }
                100% { left: 100%; width: 35%; }
            }

            .version-tag {
                position: absolute;
                bottom: 12px;
                font-size: 10px;
                font-weight: 600;
                color: #80848e;
                letter-spacing: 0.04em;
            }
        </style>
    </head>
    <body>
        <div class="splash-container">
            <div class="logo-wrapper">
                <div class="logo-glow"></div>
                <div class="spinner-ring"></div>
                <img class="logo-icon" src="../../assets/icon.png" alt="Zycord" />
            </div>

            <div class="status-container">
                <div class="status-text" id="status-text">CHECKING FOR UPDATES...</div>
                <div class="progress-track">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="version-tag" id="version-tag">ZYCORD v1.0.0</div>

        <script>
            const { ipcRenderer } = require("electron");

            const statusText = document.getElementById("status-text");
            const progressBar = document.getElementById("progress-bar");
            const versionTag = document.getElementById("version-tag");

            ipcRenderer.on("status", (event, { message, percent, determinate }) => {
                if (message) statusText.textContent = message.toUpperCase();
                if (determinate && percent != null) {
                    progressBar.classList.add("determinate");
                    progressBar.style.left = "0";
                    progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
                } else if (!determinate) {
                    progressBar.classList.remove("determinate");
                }
            });

            ipcRenderer.on("version", (event, version) => {
                if (version) versionTag.textContent = `ZYCORD v${version}`;
            });
        </script>
    </body>
</html>
