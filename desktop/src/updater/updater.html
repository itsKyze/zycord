<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Zycord</title>
        <link rel="stylesheet" href="updater.css" />
    </head>
    <body>
        <div class="updater-window" id="updater-window">
            <div class="content-wrapper">
                <!-- Discord-Style Animated Mascot & Orbiting Blur Trails -->
                <div class="logo-stage" id="logo-stage">
                    <!-- Spinning Kinetic Orbit Trails -->
                    <svg class="orbit-spinner" viewBox="0 0 100 100" fill="none">
                        <path class="orbit-trail trail-1" d="M 50 10 A 40 40 0 0 1 88 40" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
                        <path class="orbit-trail trail-2" d="M 85 65 A 40 40 0 0 1 50 90" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
                        <path class="orbit-trail trail-3" d="M 22 75 A 40 40 0 0 1 12 45" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
                    </svg>

                    <!-- Center Controller Mascot with Signature Tilt/Wobble -->
                    <div class="mascot-wrapper">
                        <svg class="mascot-svg" viewBox="0 0 71 55" fill="none">
                            <path
                                d="M60.1 4.9A58.4 58.4 0 0 0 45.4 0.3a0.4 0.4 0 0 0-.4.2 40.5 40.5 0 0 0-1.8 3.7 54 54 0 0 0-15.4 0A37.5 37.5 0 0 0 26 0.5a0.4 0.4 0 0 0-.4-.2A58.2 58.2 0 0 0 10.9 4.9a0.4 0.4 0 0 0-.2.2C1.7 18.6-0.8 32 0.3 45.2a0.4 0.4 0 0 0 .2.3 58.7 58.7 0 0 0 17.7 8.9 0.4 0.4 0 0 0 .5-.2 42.1 42.1 0 0 0 3.6-5.9 0.4 0.4 0 0 0-.2-.6 38.6 38.6 0 0 1-5.5-2.6 0.4 0.4 0 0 1 0-.7c.4-.3.7-.6 1.1-.9a0.4 0.4 0 0 1 .4-.1 41.8 41.8 0 0 0 35.8 0 0.4 0.4 0 0 1 .4.1c.4.3.7.6 1.1.9a0.4 0.4 0 0 1 0 .7 36.3 36.3 0 0 1-5.5 2.6 0.4 0.4 0 0 0-.2.6 47.4 47.4 0 0 0 3.6 5.9 0.4 0.4 0 0 0 .5.2 58.5 58.5 0 0 0 17.8-8.9 0.4 0.4 0 0 0 .2-.3c1.3-15.3-2.3-28.5-9.6-40.1a0.4 0.4 0 0 0-.2-.2zM23.7 37.1c-3.5 0-6.3-3.2-6.3-7.1s2.8-7.1 6.3-7.1c3.6 0 6.4 3.2 6.3 7.1 0 3.9-2.8 7.1-6.3 7.1zm23.6 0c-3.5 0-6.3-3.2-6.3-7.1s2.8-7.1 6.3-7.1c3.6 0 6.4 3.2 6.3 7.1 0 3.9-2.8 7.1-6.3 7.1z"
                                fill="#FFFFFF"
                            />
                        </svg>
                    </div>
                </div>

                <!-- Status Text Area -->
                <div class="text-container">
                    <div class="status-primary" id="status-primary">Starting...</div>
                    <div class="status-secondary" id="status-secondary"></div>
                </div>

                <!-- Minimal Progress Bar Container -->
                <div class="progress-wrapper" id="progress-wrapper">
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <!-- Action Button for manual retry if needed -->
                <div class="action-wrapper" id="action-wrapper" hidden>
                    <button class="btn-retry" id="btn-retry">Retry</button>
                </div>
            </div>
        </div>

        <script src="updater.js"></script>
    </body>
</html>
