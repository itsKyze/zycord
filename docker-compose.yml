name: zycord

x-server: &server
    build:
        context: .
        target: server
        args:
            REVISION: ${REVISION:-}
    image: ghcr.io/itskyze/zycord:server-main
    init: true

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: zycord
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: zycord
        volumes:
            - postgres:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U zycord -d zycord"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    client:
        <<: *server
        command: ["client"]
        restart: "no"
        environment:
            CLIENT_CONCURRENCY: ${CLIENT_CONCURRENCY:-8}
        volumes:
            - client:/data/client

    sfu:
        image: ghcr.io/itskyze/zycord:sfu-main
        init: true
        restart: unless-stopped
        environment:
            WRTC_PUBLIC_IP: ${WRTC_PUBLIC_IP:?set WRTC_PUBLIC_IP in .env}
            WRTC_PORT: ${WRTC_PORT:-50000}
            PION_SFU_VERBOSE: ${PION_SFU_VERBOSE:-}
        ports:
            - "${WRTC_PORT:-50000}:${WRTC_PORT:-50000}/udp"
        volumes:
            - sfu:/run/sfu
        healthcheck:
            test: ["CMD", "test", "-S", "/run/sfu/sfu.sock"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    server:
        <<: *server
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            sfu:
                condition: service_healthy
            client:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            DATABASE: postgres://zycord:${POSTGRES_PASSWORD}@postgres:5432/zycord
            DOMAIN: ${DOMAIN:?set DOMAIN in .env}
            CDN_DOMAIN: ${CDN_DOMAIN:-cdn.zyron.site}
            INSTANCE_NAME: ${INSTANCE_NAME:-}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
            WRTC_PUBLIC_IP: ${WRTC_PUBLIC_IP}
            WRTC_LAN_IP: ${WRTC_LAN_IP:-192.168.1.4,127.0.0.1}
            WRTC_PORT_MIN: ${WRTC_PORT:-50000}
            HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-}
            HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-}
            SMTP_SECURE: ${SMTP_SECURE:-}
            SMTP_STARTTLS: ${SMTP_STARTTLS:-}
            SMTP_USERNAME: ${SMTP_USERNAME:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            EMAIL_FROM: ${EMAIL_FROM:-}
            LOG_REQUESTS: ${LOG_REQUESTS:-500,501}
        # only on the host's loopback, for a reverse proxy running outside compose instead of the caddy service
        ports:
            - "127.0.0.1:3002:3001"
        volumes:
            - state:/data/state
            - storage:/data/storage
            - client:/data/client
            - sfu:/run/sfu
            - ./public:/app/public
            - ./public:/app/assets/public
            - ./assets/client_patches:/app/assets/client_patches
            - ./assets/badge-icons:/app/assets/badge-icons
            - ./assets/email_templates:/app/assets/email_templates
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 2m

    # optional: starts only with the caddy profile, COMPOSE_PROFILES=caddy in .env
    caddy:
        build:
            context: ./docker
            dockerfile: Dockerfile.caddy
        image: zycord-caddy-cf:latest
        profiles: ["caddy"]
        restart: unless-stopped
        depends_on:
            server:
                condition: service_healthy
        environment:
            DOMAIN: ${DOMAIN}
            CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
            CF_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in .env}
            CF_ZONE_ID: ${CF_ZONE_ID:?set CF_ZONE_ID in .env}
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        healthcheck:
            test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s

volumes:
    postgres:
    state:
    storage:
    client:
    sfu:
    caddy_data:
    caddy_config:
